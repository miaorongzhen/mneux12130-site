<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="山门三十日 - 凡人入山门文字修仙原型">
  <title>山门三十日</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b0d;
      --bg-2: #101417;
      --panel: rgba(20, 25, 28, .88);
      --panel-2: rgba(29, 35, 39, .9);
      --ink: #f2efe3;
      --muted: #a9aa9f;
      --faint: #72776f;
      --line: rgba(231, 219, 178, .18);
      --gold: #d7b568;
      --gold-2: #f0d98d;
      --jade: #66c59a;
      --red: #d86d61;
      --blue: #86a7d9;
      --paper: #e8dfc5;
      --paper-ink: #242118;
      --shadow: 0 24px 80px rgba(0, 0, 0, .42);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(120deg, rgba(9, 11, 13, .88), rgba(9, 11, 13, .56)),
        radial-gradient(circle at 18% 10%, rgba(215, 181, 104, .16), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(102, 197, 154, .12), transparent 30%),
        radial-gradient(circle at 50% 105%, rgba(134, 167, 217, .10), transparent 28%),
        var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(231, 219, 178, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(231, 219, 178, .035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.25));
    }

    button, input { font: inherit; }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .app {
      width: min(1420px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      min-height: 64px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .seal {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid rgba(215, 181, 104, .42);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(215, 181, 104, .22), rgba(102, 197, 154, .08)),
        rgba(10, 12, 13, .84);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 28px rgba(215, 181, 104, .10);
    }

    .seal svg { width: 28px; height: 28px; }

    .brand h1 {
      margin: 0;
      font-size: clamp(24px, 4.6vw, 42px);
      line-height: 1;
      font-weight: 900;
      color: var(--gold-2);
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 340px;
      gap: 14px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    .panel.pad { padding: 16px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      color: var(--gold-2);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 9px;
      border: 1px solid rgba(215, 181, 104, .28);
      border-radius: var(--radius);
      color: var(--gold-2);
      background: rgba(215, 181, 104, .08);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .btn {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(215, 181, 104, .32);
      border-radius: var(--radius);
      background: rgba(215, 181, 104, .12);
      color: var(--gold-2);
      font-size: 13px;
      font-weight: 900;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }

    .btn:hover, .choice:hover {
      transform: translateY(-1px);
      border-color: rgba(240, 217, 141, .64);
      background: rgba(215, 181, 104, .18);
    }

    .btn.primary {
      border-color: rgba(102, 197, 154, .45);
      background: rgba(102, 197, 154, .18);
      color: #b8f0d2;
    }

    .btn.danger {
      border-color: rgba(216, 109, 97, .42);
      background: rgba(216, 109, 97, .12);
      color: #ffb4aa;
    }

    .hero-card {
      position: relative;
      min-height: 210px;
      padding: 20px;
      background:
        linear-gradient(120deg, rgba(12, 16, 17, .86), rgba(12, 16, 17, .52)),
        radial-gradient(circle at 70% 10%, rgba(215, 181, 104, .22), transparent 32%),
        linear-gradient(145deg, rgba(52, 72, 62, .68), rgba(35, 38, 43, .92));
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(232, 223, 197, .14);
      border-radius: var(--radius);
      pointer-events: none;
    }

    .mountains {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 58%;
      min-width: 360px;
      opacity: .72;
    }

    .hero-text {
      position: relative;
      z-index: 1;
      max-width: 720px;
    }

    .hero-text h2 {
      margin: 0 0 12px;
      font-size: clamp(26px, 4.7vw, 58px);
      line-height: 1.08;
      color: var(--gold-2);
    }

    .hero-text p {
      margin: 0;
      max-width: 720px;
      color: rgba(242, 239, 227, .82);
      font-size: 17px;
      line-height: 1.75;
    }

    .story {
      padding: 18px;
    }

    .dayline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .progress {
      position: relative;
      height: 8px;
      margin: 0 0 16px;
      border-radius: 999px;
      background: rgba(242, 239, 227, .12);
      overflow: hidden;
    }

    .progress span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--jade), var(--gold));
      transition: width .25s ease;
    }

    .event-title {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.2;
    }

    .event-body {
      margin: 0 0 18px;
      color: rgba(242, 239, 227, .84);
      font-size: 17px;
      line-height: 1.86;
      white-space: pre-line;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      min-height: 58px;
      padding: 13px 14px;
      border: 1px solid rgba(232, 223, 197, .18);
      border-radius: var(--radius);
      background: rgba(232, 223, 197, .07);
      color: var(--ink);
      text-align: left;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }

    .choice strong {
      display: block;
      margin-bottom: 5px;
      color: var(--gold-2);
      font-size: 15px;
    }

    .choice span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .choice:disabled {
      cursor: not-allowed;
      opacity: .46;
      transform: none;
    }

    .stats {
      display: grid;
      gap: 10px;
    }

    .stat {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 42px;
      gap: 9px;
      align-items: center;
      min-height: 30px;
    }

    .stat label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(242, 239, 227, .10);
      overflow: hidden;
    }

    .bar span {
      display: block;
      width: 50%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--jade));
      transition: width .25s ease;
    }

    .stat strong {
      color: var(--ink);
      font-size: 13px;
      text-align: right;
    }

    .method-list, .relation-list, .log-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .method-card {
      padding: 12px;
      border: 1px solid rgba(232, 223, 197, .14);
      border-radius: var(--radius);
      background: rgba(232, 223, 197, .055);
    }

    .method-card.active {
      border-color: rgba(102, 197, 154, .46);
      background: rgba(102, 197, 154, .09);
    }

    .method-card strong, .relation-list strong {
      display: block;
      margin-bottom: 5px;
      color: var(--ink);
      font-size: 14px;
    }

    .method-card span, .relation-list span, .log-list li {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .relation-list li {
      padding: 10px 0;
      border-bottom: 1px solid rgba(232, 223, 197, .10);
    }

    .relation-list li:last-child { border-bottom: 0; }

    .log-list {
      max-height: 300px;
      overflow: auto;
      padding-right: 4px;
    }

    .log-list li {
      padding: 9px 10px;
      border-left: 3px solid rgba(215, 181, 104, .42);
      border-radius: 0 var(--radius) var(--radius) 0;
      background: rgba(232, 223, 197, .055);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .paper-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(3, 4, 5, .72);
      backdrop-filter: blur(12px);
    }

    .paper-modal.open { display: flex; }

    .paper {
      width: min(760px, 100%);
      max-height: min(760px, calc(100vh - 32px));
      overflow: auto;
      border: 1px solid rgba(82, 60, 23, .24);
      border-radius: var(--radius);
      background:
        linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.08)),
        var(--paper);
      color: var(--paper-ink);
      box-shadow: 0 30px 120px rgba(0,0,0,.58);
      padding: 24px;
    }

    .paper h2 {
      margin: 0 0 12px;
      color: #4d3314;
      font-size: 30px;
    }

    .paper p {
      margin: 0 0 14px;
      line-height: 1.78;
    }

    .paper .btn {
      color: #4d3314;
      border-color: rgba(77, 51, 20, .28);
      background: rgba(77, 51, 20, .08);
    }

    .footer-note {
      margin: 14px 0 0;
      color: var(--faint);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: 260px minmax(0, 1fr); }
      .right-col { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }

    @media (max-width: 820px) {
      .topbar { grid-template-columns: 1fr; padding-bottom: 12px; }
      .top-actions { justify-content: flex-start; }
      .layout, .right-col { grid-template-columns: 1fr; }
      .hero-card { min-height: 250px; }
      .mountains { width: 110%; min-width: 0; opacity: .38; }
      .stat { grid-template-columns: 66px minmax(0, 1fr) 38px; }
    }

    @media (max-width: 520px) {
      .app { width: min(100% - 18px, 1420px); padding-top: 10px; }
      .top-actions .btn { flex: 1 1 calc(50% - 8px); }
      .hero-card, .story, .panel.pad { padding: 13px; }
      .event-body { font-size: 16px; }
      .choice { min-height: 62px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="seal" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M32 5 49 16v19c0 12-8 20-17 24-9-4-17-12-17-24V16L32 5Z" fill="none" stroke="#f0d98d" stroke-width="4"/>
            <path d="M21 35c9-2 17-8 22-19-1 16-6 26-18 32 5-7 4-11-4-13Z" fill="#66c59a"/>
          </svg>
        </div>
        <div>
          <h1>山门三十日</h1>
          <p>山下凡人 · 入门选拔 · 文字修仙原型</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn primary" id="newRunBtn">新开一局</button>
        <button class="btn" id="saveBtn">保存</button>
        <button class="btn" id="loadBtn">读取</button>
        <button class="btn danger" id="clearBtn">清档</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel pad left-col" aria-label="角色状态">
        <h2 class="section-title">命簿 <span class="pill" id="realmText">引气未稳</span></h2>
        <div class="stats" id="stats"></div>
        <div class="chips" id="tags"></div>
        <h2 class="section-title" style="margin-top:18px">入山命线</h2>
        <ul class="method-list" id="methods"></ul>
      </aside>

      <section class="panel main-col" aria-label="游戏正文">
        <div class="hero-card">
          <svg class="mountains" viewBox="0 0 760 360" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
            <defs>
              <linearGradient id="m1" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#d7b568" stop-opacity=".58"/>
                <stop offset="1" stop-color="#090b0d" stop-opacity=".2"/>
              </linearGradient>
            </defs>
            <path d="M0 312 98 204l66 48L258 88l112 168 84-104 92 122 82-70 132 116v40H0Z" fill="url(#m1)"/>
            <path d="M0 334 130 245l108 48 118-84 126 74 82-34 196 90v21H0Z" fill="#0f1515" opacity=".82"/>
            <circle cx="576" cy="78" r="42" fill="#f0d98d" opacity=".45"/>
          </svg>
          <div class="hero-text">
            <h2 id="sceneTitle">外门钟响</h2>
          <p id="sceneIntro">三十日后，青岚宗开山收徒。你仍是山下凡人，手里只有一点盘缠、一点人情，和一件不能确定是福是祸的事。</p>
          </div>
        </div>
        <div class="story">
          <div class="dayline">
            <span id="dayText">第 1 日 / 30</span>
            <span id="phaseText">清晨</span>
          </div>
          <div class="progress" aria-hidden="true"><span id="dayProgress"></span></div>
          <h2 class="event-title" id="eventTitle">选择今日修行</h2>
          <p class="event-body" id="eventBody"></p>
          <div class="choices" id="choices"></div>
        </div>
      </section>

      <aside class="right-col" aria-label="关系和记录">
        <section class="panel pad">
          <h2 class="section-title">人脉</h2>
          <ul class="relation-list" id="relations"></ul>
        </section>
        <section class="panel pad">
          <h2 class="section-title">近事</h2>
          <ul class="log-list" id="log"></ul>
        </section>
      </aside>
    </main>

    <p class="footer-note">本页为本地可运行的静态文字游戏原型。存档只写入当前浏览器 localStorage。</p>
  </div>

  <div class="paper-modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="paper">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <div class="chips" id="modalChips"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:18px">
        <button class="btn primary" id="modalContinue">继续</button>
        <button class="btn" id="modalNew">再开一局</button>
      </div>
    </div>
  </div>

  <script>
    const SAVE_KEY = "shanmen30.save.v2";

    const methods = [
      { id: "omen", name: "正缘", desc: "你曾被半枚青玉符救过一次。它不邪，却像在等真正主人。", stats: { qi: 8, mind: 4, karma: 1 }, tag: "青玉符" },
      { id: "mortal", name: "人缘", desc: "没有奇遇，没有异象。你只靠盘缠、人情、胆量和凡人的办法。", stats: { stones: 4, body: 5, merit: 1 }, tag: "凡骨" },
      { id: "shadow", name: "邪缘", desc: "你在乱葬岗捡到一枚黑骨珠。它能救命，也会在梦里回头看你。", stats: { qi: 12, karma: -4, mind: -6 }, tag: "黑骨珠" }
    ];

    const baseState = () => ({
      day: 1,
      phase: "清晨",
      realm: "凡骨未验",
      method: null,
      ended: false,
      stats: { qi: 6, body: 42, mind: 46, stones: 5, herbs: 1, merit: 0, karma: 0, wound: 0 },
      rel: { master: 0, senior: 0, rival: 0, mortal: 0 },
      flags: [],
      log: ["你在青岚山下醒来，听见茶棚里有人谈起三十日后的开山收徒。"],
      current: "intro"
    });

    let state = baseState();

    const statDefs = [
      ["qi", "灵气", 100], ["body", "体魄", 100], ["mind", "心神", 100], ["stones", "灵石", 30],
      ["herbs", "草药", 20], ["merit", "功绩", 30], ["karma", "因果", 30], ["wound", "暗伤", 30]
    ];

    const relationDefs = {
      master: ["赵管事", "青岚宗山下办事人，掌管杂役名册和引荐文书。"],
      senior: ["沈青衣", "偶尔下山采买的外门弟子，话少，看人很准。"],
      rival: ["周砚", "同村少年，家里凑足了路费，也想进山门。"],
      mortal: ["阿桃", "药铺学徒，知道山下人情和采药小路。"]
    };

    const events = [
      {
        id: "teahouse", title: "茶棚传闻", body: "茶棚里挤满了想上山的人。有人说青岚宗今年只收二十名外门，杂役也要验骨。赵管事坐在角落，像没听见这些慌乱。",
        choices: [
          { label: "替赵管事添茶", hint: "+赵管事 +功绩", effect: { master: 1, merit: 1, stones: -1 }, log: "赵管事没有谢你，只问你家住哪里。" },
          { label: "向老客打听规矩", hint: "+心神 +人情", effect: { mind: 5, mortal: 1 }, log: "你知道了验骨、问心、登阶三关，至少不再两眼一黑。" },
          { label: "记下收徒价码", hint: "+灵石意识，-心神", effect: { stones: 1, mind: -2 }, log: "你第一次明白，仙门也要路费、文书和人情。" }
        ]
      },
      {
        id: "market", title: "山下小市", body: "开山收徒的消息一出，青岚山脚的小市也涨了价。草鞋、干粮、伤药、假符，全都说自己能保人上山。",
        choices: [
          { label: "买伤药和干粮", hint: "-灵石 +草药 +体魄", cost: { stones: 2 }, effect: { herbs: 2, body: 4 }, log: "阿桃替你挑了不掺灰的药包。" },
          { label: "帮阿桃搬药箱", hint: "+灵石 +阿桃", effect: { stones: 3, mortal: 1, body: -2 }, log: "阿桃说，山门后有条少人走的旧石阶。" },
          { label: "买一张残符", hint: "正缘/邪缘会有异动", effect: (s) => s.method === "omen" ? gain({ qi: 9, karma: 2 }, "青玉符微微发热，残符上的山纹亮了一瞬。") : s.method === "shadow" ? gain({ qi: 13, mind: -5, karma: -2 }, "黑骨珠吞掉残符灰烬，你舌尖尝到铁锈味。") : gain({ stones: -2, mind: 2 }, "残符只是残符。你亏了钱，也学会少信热闹。") }
        ]
      },
      {
        id: "rival", title: "周砚争名", body: "周砚在村口拦住你。他家卖了牛，凑够路费。他说山门不是谁都能去的，至少你不该挡他的路。",
        choices: [
          { label: "和他讲清利害", hint: "+心神，关系可能缓和", effect: { mind: 4, rival: -1 }, log: "周砚没服气，但他知道你不是来抢他的命。" },
          { label: "激他一起上山", hint: "+体魄 +周砚敌意", effect: { body: 5, rival: 1, mind: -2 }, log: "你们约定登阶时见，话说得狠，脚下却都有点发虚。" },
          { label: "避开他去采药", hint: "+草药 +阿桃，-功绩", effect: { herbs: 2, mortal: 1, merit: -1 }, log: "你没争这口气，却找到几株能换盘缠的石缝草。" }
        ]
      },
      {
        id: "well", title: "废丹井", body: "阿桃说的废丹井果然存在。井口有旧封条，里面传来微弱药香，也有一点像腐木烧尽后的冷味。",
        choices: [
          { label: "只取井边药苔", hint: "+草药 +心神", effect: { herbs: 3, mind: 3 }, log: "你没有下井。药苔够换两日干粮，命也还在。" },
          { label: "下井一探", hint: "高风险 +奇缘/邪缘", effect: (s) => check(s.stats.mind + s.stats.qi, 72) ? gain({ qi: 12, herbs: 2, karma: s.method === "shadow" ? -2 : 2 }, "井底旧阵亮起，你听见有人在很远处叹息。") : gain({ wound: 6, mind: -6 }, "井中冷气钻进骨缝，你爬出来时已分不清日色。") },
          { label: "把封条交给赵管事", hint: "+功绩 +赵管事", effect: { merit: 3, master: 1, karma: 1 }, log: "赵管事收起封条，低声说：这口井不是给凡人看的。" }
        ]
      },
      {
        id: "dream", title: "怪梦", body: "夜里你梦见山门开了又关。门缝里有人叫你的名字，也有人说，凡人进山，先要把凡心留下。",
        choices: [
          { label: "把梦记下来", hint: "+心神 +灵气", effect: { mind: 7, qi: 3 }, log: "你发现梦里的钟声和山门晨钟差了半拍。" },
          { label: "吞药压梦", hint: "-草药 +心神", cost: { herbs: 1 }, effect: { mind: 11, body: 2 }, log: "药气压住梦魇，天亮时你仍记得自己是谁。" },
          { label: "回应门里声音", hint: "邪缘收益更高", effect: (s) => s.method === "shadow" ? gain({ qi: 16, mind: -7, karma: -3 }, "黑骨珠在枕下滚动，梦里那扇门开了一寸。") : gain({ mind: -6, wound: 2 }, "你只听见混乱回声，醒后头痛欲裂。") }
        ]
      },
      {
        id: "beast", title: "山魈夜过", body: "雨夜里，一只受伤山魈闯进村边药圃。村人不敢靠近，赵管事却站在远处看你们这些想上山的人。",
        choices: [
          { label: "引开山魈", hint: "检定体魄/灵气", effect: (s) => check(s.stats.body + s.stats.qi, 68) ? gain({ merit: 4, body: -4, qi: 4 }, "你把山魈引到溪边，沈青衣出手前多看了你一眼。") : gain({ wound: 5, merit: 1 }, "你被山魈撞倒，好在没让它进村。") },
          { label: "护住药圃", hint: "+草药 +功绩", effect: { herbs: 4, merit: 2, body: -3 }, log: "你保下几畦灵草，阿桃差点哭出来。" },
          { label: "趁乱取妖血", hint: "邪缘/正缘异动", effect: (s) => s.method === "shadow" ? gain({ qi: 15, karma: -4, wound: 2 }, "黑骨珠吸尽妖血，你手背多出一道细纹。") : gain({ qi: 6, karma: -1, mind: -4 }, "妖血很热，你忽然害怕自己刚才的贪念。") }
        ]
      },
      {
        id: "senior", title: "外门弟子", body: "沈青衣下山采买，见你背着药筐等在雨里。她问：你想进山，是为了长生，还是为了离开这里？",
        choices: [
          { label: "为了活得久一点", hint: "+心神 +沈青衣", effect: { mind: 5, senior: 1, qi: 3 }, log: "沈青衣说，长生听起来远，活过明天才近。" },
          { label: "为了不再求人", hint: "+体魄 +周砚敌意", effect: { body: 6, rival: 1, mind: -2 }, log: "沈青衣没有笑你，只教你登阶时如何省力。" },
          { label: "为了有得选", hint: "+关系 +因果", effect: { senior: 2, karma: 2, mind: 2 }, log: "沈青衣沉默很久，说她当年也是这么答的。" }
        ]
      },
      {
        id: "debt", title: "家中欠账", body: "掌柜拿出账本，说你若上山，药铺少一个人，欠下的药钱总要有人还。你知道他说得难听，却不全是假话。",
        choices: [
          { label: "先还一半", hint: "-灵石 +心神 +人缘", cost: { stones: 2 }, effect: { mind: 5, mortal: 1, karma: 2 }, log: "掌柜收了钱，脸色仍冷，却没再说拦你的话。" },
          { label: "写下欠契", hint: "+灵石，未来留债", effect: { stones: 3, mind: -3, karma: -1 }, log: "你拿到路费，也把一张欠契留在凡俗。" },
          { label: "求阿桃作保", hint: "+阿桃，-人情", effect: { mortal: 2, stones: 1, mind: 1 }, log: "阿桃替你说话。你第一次觉得人情比灵石还重。" }
        ]
      }
    ];

    const milestones = {
      6: { title: "收徒告示", body: "青岚宗告示贴到镇口：三十日后开山，凡骨可验，杂役亦收。人群散去后，你还站在告示前。", effect: { mind: 2 } },
      11: { title: "路费涨价", body: "上山挑夫、草鞋、伤药全涨了价。想入仙门的人越多，凡俗的手伸得越快。", effect: { stones: -1, mind: -2 } },
      16: { title: "旧事露角", body: "有人提起废丹井，赵管事脸色微变。沈青衣提醒你：有些机缘，宗门也未必愿意承认。", effect: { qi: 3, senior: 1 } },
      21: { title: "山雨封路", body: "连日大雨冲坏旧石阶。有人决定放弃，有人临时抬价，有人说这是山门在筛人。", effect: { body: -2, mind: -2, karma: 1 } },
      26: { title: "登山名册", body: "赵管事终于写下你的名字。不是收你入门，只是准你登山。可对凡人来说，这已经是第一道门。", effect: { merit: 2, master: 1 } }
    };

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function chance(n) { return Math.random() * 100 < n; }
    function check(score, target) { return score + Math.random() * 30 >= target; }

    function gain(delta, logText) {
      applyDelta(delta);
      return logText;
    }

    function applyDelta(delta) {
      for (const [key, value] of Object.entries(delta || {})) {
        if (key in state.stats) state.stats[key] += value;
        else if (key in state.rel) state.rel[key] += value;
      }
      normalize();
    }

    function normalize() {
      state.stats.qi = clamp(state.stats.qi, 0, 120);
      state.stats.body = clamp(state.stats.body, 0, 100);
      state.stats.mind = clamp(state.stats.mind, 0, 100);
      state.stats.stones = clamp(state.stats.stones, 0, 99);
      state.stats.herbs = clamp(state.stats.herbs, 0, 99);
      state.stats.merit = clamp(state.stats.merit, -10, 99);
      state.stats.karma = clamp(state.stats.karma, -30, 99);
      state.stats.wound = clamp(state.stats.wound, 0, 99);
      for (const k of Object.keys(state.rel)) state.rel[k] = clamp(state.rel[k], -5, 9);
      if (state.stats.qi >= 62 && state.stats.mind >= 42 && state.stats.wound <= 18) state.realm = "灵光初现";
      else if (state.stats.qi >= 30 && state.stats.body >= 36) state.realm = "似有灵感";
      else state.realm = "凡骨未验";
    }

    function canPay(cost = {}) {
      return Object.entries(cost).every(([key, value]) => (state.stats[key] || 0) >= value);
    }

    function pay(cost = {}) {
      for (const [key, value] of Object.entries(cost)) state.stats[key] -= value;
      normalize();
    }

    function chooseMethod(id) {
      const method = methods.find(m => m.id === id);
      state.method = id;
      state.flags.push(method.tag);
      applyDelta(method.stats);
      state.current = "daily";
      addLog(`你选择《${method.name}》，从此修行有了偏向。`);
      render();
    }

    function addLog(text) {
      state.log.unshift(`第 ${state.day} 日：${text}`);
      state.log = state.log.slice(0, 16);
    }

    function nextEvent() {
      if (state.day > 30) return finalTrial();
      if (milestones[state.day]) return { type: "milestone", ...milestones[state.day] };
      const index = (state.day * 7 + state.stats.qi + state.stats.merit + state.flags.length) % events.length;
      return { type: "event", ...events[index] };
    }

    function advanceDay() {
      state.day += 1;
      state.phase = state.day >= 30 ? "登山之日" : (state.day % 5 === 0 ? "黄昏" : "清晨");
      state.stats.body -= state.stats.wound > 18 ? 3 : 1;
      state.stats.mind -= state.method === "ghost" ? 2 : 1;
      state.stats.qi += state.method === "alchemy" ? 3 : 2;
      normalize();
      if (state.stats.body <= 0 || state.stats.mind <= 0) return badEnd("未至山门", "你没有倒在仙途上，而是倒在登山前的某个清晨。凡人想进山门，也要先撑过凡俗的讨债。", ["暗伤过重", "心神失守"]);
      state.current = "daily";
      render();
    }

    function resolveChoice(choice) {
      if (!canPay(choice.cost)) return;
      pay(choice.cost);
      let text = choice.log || "你做出了选择。";
      if (typeof choice.effect === "function") text = choice.effect(state);
      else applyDelta(choice.effect);
      addLog(text);
      if (state.day >= 30) finalTrial();
      else advanceDay();
    }

    function finalTrial() {
      normalize();
      const s = state.stats;
      const support = state.rel.master + state.rel.senior + Math.max(0, state.rel.mortal) - Math.max(0, state.rel.rival);
      const score = s.qi * .9 + s.body * .45 + s.mind * .65 + s.merit * 2.4 + s.karma * 1.1 + support * 3 - s.wound * 2;
      if (score >= 112 && s.wound <= 22) return endGame("入外门", "山门石阶尽头，赵管事把一枚木牌递给你。它不是仙箓，只是外门弟子的名牌。可你知道，从今天起，你终于站进了那扇门里。", ["外门弟子", state.realm, methodName()]);
      if (s.merit >= 8 || state.rel.master >= 4) return endGame("杂役弟子", "你的灵光不够亮，名字也不够靠前。但赵管事把你留在了杂役院。扫地、挑水、烧炉，从这里开始，也算半只脚进了仙门。", ["杂役弟子", "低处开局", methodName()]);
      if (state.method === "shadow" && s.qi >= 58) return endGame("旁门递手", "验灵石没有亮，黑骨珠却在袖中发烫。下山路上，有个戴斗笠的人问你：青岚不要你，想不想走另一条路？", ["旁门伏笔", "黑骨珠", "未入宗门"]);
      if (state.method === "omen" && s.qi >= 45) return endGame("灵根封存", "验灵石亮了一瞬，又被沈青衣伸手按住。她说此事不可外传，让你三个月后再来。你落选了，也被某件事记住了。", ["青玉符", "三月后", "悬念"]);
      if (s.karma >= 11 && state.rel.mortal >= 3) return endGame("山下守契", "你没有登完山。雨夜里，阿桃和几个村人被妖气困在药圃，你折返回去。山门关上时，沈青衣留下一枚旧木牌。", ["凡俗牵绊", "旧木牌", methodName()]);
      return badEnd("落选归山下", "你登上了石阶，也走到了问心处，却没能留下。周砚从你身边走过，没有笑。你们都知道，山门不是梦，它只是更硬的一堵墙。", [state.realm, methodName(), "仍可再来"]);
    }

    function badEnd(title, body, chips) { return endGame(title, body, chips); }

    function endGame(title, body, chips) {
      state.ended = true;
      showModal(title, body, chips);
      render();
    }

    function methodName() {
      return methods.find(m => m.id === state.method)?.name || "未定命线";
    }

    function showModal(title, body, chips = []) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").textContent = body;
      document.getElementById("modalChips").innerHTML = chips.map(c => `<span class="pill">${escapeHtml(c)}</span>`).join("");
      document.getElementById("modal").classList.add("open");
    }

    function closeModal() { document.getElementById("modal").classList.remove("open"); }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"]/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[s]));
    }

    function render() {
      normalize();
      renderStats();
      renderMethods();
      renderRelations();
      renderLog();
      document.getElementById("realmText").textContent = state.realm;
      document.getElementById("dayText").textContent = `第 ${Math.min(state.day, 30)} 日 / 30`;
      document.getElementById("phaseText").textContent = state.phase;
      document.getElementById("dayProgress").style.width = `${clamp((state.day - 1) / 29 * 100, 0, 100)}%`;
      document.getElementById("tags").innerHTML = [methodName(), ...state.flags.filter(Boolean)].slice(0, 5).map(t => `<span class="pill">${escapeHtml(t)}</span>`).join("");

      if (!state.method) return renderIntro();
      if (state.ended) return;
      const ev = nextEvent();
      if (ev.type === "milestone") return renderMilestone(ev);
      renderEvent(ev);
    }

    function renderIntro() {
      document.getElementById("sceneTitle").textContent = "山下凡人";
      document.getElementById("sceneIntro").textContent = "三十日后，青岚宗开山收徒。你还不是弟子，甚至未必有灵根。可凡人若想入山，总要先决定自己凭什么敲门。";
      document.getElementById("eventTitle").textContent = "选择你的入山命线";
      document.getElementById("eventBody").textContent = "这不是阵营，也不是善恶。正缘有因果，邪缘有代价，人缘没有奇迹。你只是从不同的缝隙里，看见同一座山门。";
      document.getElementById("choices").innerHTML = methods.map(m => `<button class="choice" data-method="${m.id}"><strong>${m.name}</strong><span>${m.desc}</span></button>`).join("");
      document.querySelectorAll("[data-method]").forEach(btn => btn.addEventListener("click", () => chooseMethod(btn.dataset.method)));
    }

    function renderMilestone(ev) {
      document.getElementById("sceneTitle").textContent = ev.title;
      document.getElementById("sceneIntro").textContent = ev.body;
      document.getElementById("eventTitle").textContent = ev.title;
      document.getElementById("eventBody").textContent = ev.body;
      document.getElementById("choices").innerHTML = `<button class="choice" id="milestoneBtn"><strong>记下此事</strong><span>宗门局势推进，继续下一日。</span></button>`;
      document.getElementById("milestoneBtn").addEventListener("click", () => {
        applyDelta(ev.effect);
        addLog(ev.body);
        advanceDay();
      });
    }

    function renderEvent(ev) {
      document.getElementById("sceneTitle").textContent = "山门未开";
      document.getElementById("sceneIntro").textContent = "每一天都很短，短到只够你选一件真正重要的事。路费、人情、伤药、怪梦，都会把你推向不同的门口。";
      document.getElementById("eventTitle").textContent = ev.title;
      document.getElementById("eventBody").textContent = ev.body;
      document.getElementById("choices").innerHTML = ev.choices.map((c, i) => {
        const disabled = !canPay(c.cost) ? "disabled" : "";
        const need = c.cost ? `需 ${Object.entries(c.cost).map(([k,v]) => statName(k) + v).join("、")}` : c.hint;
        return `<button class="choice" data-choice="${i}" ${disabled}><strong>${c.label}</strong><span>${escapeHtml(need || "")}</span></button>`;
      }).join("");
      document.querySelectorAll("[data-choice]").forEach(btn => btn.addEventListener("click", () => resolveChoice(ev.choices[Number(btn.dataset.choice)])));
    }

    function statName(key) {
      return Object.fromEntries(statDefs.map(d => [d[0], d[1]]))[key] || key;
    }

    function renderStats() {
      document.getElementById("stats").innerHTML = statDefs.map(([key, name, max]) => {
        const val = state.stats[key];
        const pct = clamp((val + (key === "karma" || key === "merit" ? 10 : 0)) / (max + (key === "karma" || key === "merit" ? 10 : 0)) * 100, 0, 100);
        const color = key === "wound" ? "linear-gradient(90deg, #d86d61, #f0d98d)" : undefined;
        return `<div class="stat"><label>${name}</label><div class="bar"><span style="width:${pct}%;${color ? `background:${color}` : ""}"></span></div><strong>${Math.round(val)}</strong></div>`;
      }).join("");
    }

    function renderMethods() {
      document.getElementById("methods").innerHTML = methods.map(m => `<li class="method-card ${state.method === m.id ? "active" : ""}"><strong>${m.name}</strong><span>${m.desc}</span></li>`).join("");
    }

    function renderRelations() {
      document.getElementById("relations").innerHTML = Object.entries(relationDefs).map(([key, [name, desc]]) => {
        const v = state.rel[key];
        const tone = v >= 4 ? "信任" : v >= 1 ? "有交情" : v <= -2 ? "敌意" : "陌生";
        return `<li><strong>${name} <span class="pill">${tone} ${v}</span></strong><span>${desc}</span></li>`;
      }).join("");
    }

    function renderLog() {
      document.getElementById("log").innerHTML = state.log.map(item => `<li>${escapeHtml(item)}</li>`).join("");
    }

    function newRun() {
      state = baseState();
      closeModal();
      render();
    }

    function saveGame() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      showModal("已保存", "你的三十日命簿已写入当前浏览器。换设备或清理浏览器数据后不会保留。", ["localStorage", `第 ${state.day} 日`, state.realm]);
    }

    function loadGame() {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return showModal("没有存档", "当前浏览器里没有找到《山门三十日》的存档。", ["空"]);
      try {
        state = { ...baseState(), ...JSON.parse(raw) };
        closeModal();
        render();
      } catch {
        showModal("存档损坏", "存档无法读取。你可以清档后重新开始。", ["读取失败"]);
      }
    }

    function clearGame() {
      localStorage.removeItem(SAVE_KEY);
      showModal("已清档", "本地存档已经删除。当前局面仍在，开新局即可重来。", ["localStorage"]);
    }

    document.getElementById("newRunBtn").addEventListener("click", newRun);
    document.getElementById("saveBtn").addEventListener("click", saveGame);
    document.getElementById("loadBtn").addEventListener("click", loadGame);
    document.getElementById("clearBtn").addEventListener("click", clearGame);
    document.getElementById("modalContinue").addEventListener("click", closeModal);
    document.getElementById("modalNew").addEventListener("click", newRun);

    render();
  </script>
</body>
</html>
