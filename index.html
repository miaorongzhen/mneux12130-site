<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="凡骨问道 - 修仙文字战斗养成原型">
  <title>凡骨问道</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d0c;
      --panel: #111918;
      --panel-2: #17211f;
      --panel-3: #1d2926;
      --ink: #f4ecd8;
      --muted: #aeb6aa;
      --faint: #788278;
      --line: rgba(218, 195, 135, .22);
      --gold: #d8b76a;
      --jade: #65c08e;
      --red: #d66a5f;
      --blue: #77a9cb;
      --purple: #b18ada;
      --shadow: 0 22px 70px rgba(0, 0, 0, .36);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(rgba(9, 13, 12, .84), rgba(9, 13, 12, .94)),
        radial-gradient(circle at 18% 12%, rgba(101, 192, 142, .16), transparent 29%),
        radial-gradient(circle at 82% 4%, rgba(216, 183, 106, .14), transparent 30%),
        #090d0c;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button, select { font: inherit; }
    button { border: 0; color: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }

    .app { width: min(1440px, calc(100% - 28px)); margin: 0 auto; padding: 16px 0 28px; }
    .topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; min-height: 72px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .seal { width: 48px; height: 48px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid rgba(216, 183, 106, .38); border-radius: var(--radius); background: rgba(216, 183, 106, .08); }
    .seal svg { width: 34px; height: 34px; }
    h1, h2, h3, p { margin-top: 0; }
    .brand h1 { margin: 0; color: #f1d68a; font-size: clamp(26px, 4.4vw, 44px); line-height: 1; font-weight: 900; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 354px; gap: 14px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(17, 25, 24, .94); box-shadow: var(--shadow); overflow: hidden; }
    .pad { padding: 16px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; color: #f1d68a; font-size: 14px; font-weight: 900; }
    .subtle { color: var(--faint); font-size: 12px; }
    .pill { display: inline-flex; align-items: center; justify-content: center; min-height: 27px; padding: 0 9px; border: 1px solid rgba(216, 183, 106, .28); border-radius: var(--radius); color: #f1d68a; background: rgba(216, 183, 106, .08); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .pill.green { border-color: rgba(101, 192, 142, .35); color: #bdf0d0; background: rgba(101, 192, 142, .09); }
    .pill.red { border-color: rgba(214, 106, 95, .36); color: #ffb9b1; background: rgba(214, 106, 95, .1); }
    .btn { min-height: 38px; padding: 0 12px; border: 1px solid rgba(216, 183, 106, .32); border-radius: var(--radius); background: rgba(216, 183, 106, .12); color: #f1d68a; font-size: 13px; font-weight: 900; transition: transform .14s ease, background .14s ease, border-color .14s ease; }
    .btn:hover, .zone:hover, .skill-btn:hover { transform: translateY(-1px); border-color: rgba(241, 214, 138, .68); background: rgba(216, 183, 106, .18); }
    .btn.primary { border-color: rgba(101, 192, 142, .48); background: rgba(101, 192, 142, .18); color: #bdf0d0; }
    .btn.danger { border-color: rgba(214, 106, 95, .45); background: rgba(214, 106, 95, .12); color: #ffb9b1; }

    .hero { position: relative; min-height: 205px; padding: 20px; background: linear-gradient(120deg, rgba(13, 20, 19, .96), rgba(16, 28, 24, .72)); }
    .hero h2 { margin: 0 0 10px; color: #f1d68a; font-size: clamp(24px, 3.6vw, 38px); line-height: 1.06; }
    .hero p { max-width: 650px; margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .hero-visual { position: absolute; right: 10px; bottom: 0; width: min(44%, 440px); height: 190px; opacity: .75; pointer-events: none; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .stats { display: grid; gap: 9px; }
    .stat { display: grid; gap: 5px; }
    .stat-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
    .bar { height: 10px; border: 1px solid rgba(255, 255, 255, .08); border-radius: 999px; overflow: hidden; background: rgba(0, 0, 0, .28); }
    .bar span { display: block; height: 100%; width: 50%; border-radius: inherit; background: var(--jade); }
    .bar.hp span { background: linear-gradient(90deg, #b84d49, #e1806d); }
    .bar.qi span { background: linear-gradient(90deg, #518fbd, #8fc9ed); }
    .bar.cult span { background: linear-gradient(90deg, #8a6ad6, #d0a3ff); }
    .bar.demon span { background: linear-gradient(90deg, #6d1b2a, #d65f75); }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tile { padding: 10px; border: 1px solid rgba(218, 195, 135, .14); border-radius: var(--radius); background: rgba(255, 255, 255, .035); min-width: 0; }
    .tile b { display: block; color: #f1d68a; font-size: 16px; line-height: 1.2; word-break: break-word; }
    .tile span { color: var(--faint); font-size: 12px; }

    .zones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .zone { min-height: 94px; padding: 11px; text-align: left; border: 1px solid rgba(218, 195, 135, .16); border-radius: var(--radius); background: rgba(255, 255, 255, .04); transition: transform .14s ease, border-color .14s ease, background .14s ease; }
    .zone.active { border-color: rgba(101, 192, 142, .55); background: rgba(101, 192, 142, .12); }
    .zone.locked { filter: grayscale(.75); opacity: .5; }
    .zone strong { display: block; margin-bottom: 5px; color: #f5df9f; font-size: 15px; }
    .zone span { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .zone em { display: block; margin-top: 6px; color: var(--jade); font-size: 12px; font-style: normal; }

    .commission-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .commission { min-height: 118px; padding: 10px; text-align: left; border: 1px solid rgba(218, 195, 135, .16); border-radius: var(--radius); background: rgba(255, 255, 255, .04); color: var(--ink); }
    .commission.locked { opacity: .48; filter: grayscale(.7); }
    .commission strong { display: block; color: #f1d68a; font-size: 13px; }
    .commission span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .commission em { display: block; margin-top: 6px; color: var(--jade); font-size: 12px; font-style: normal; }

    .trial-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .trial-stage { min-height: 112px; padding: 10px; text-align: left; border: 1px solid rgba(218, 195, 135, .16); border-radius: var(--radius); background: rgba(255, 255, 255, .04); color: var(--ink); }
    .trial-stage.cleared { border-color: rgba(101, 192, 142, .38); background: rgba(101, 192, 142, .08); }
    .trial-stage.locked { opacity: .48; filter: grayscale(.7); }
    .trial-stage strong { display: block; color: #f1d68a; font-size: 13px; }
    .trial-stage.cleared strong { color: #bdf0d0; }
    .trial-stage span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .trial-stage em { display: block; margin-top: 6px; color: var(--jade); font-size: 12px; font-style: normal; }

    .combat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
    .fighter { padding: 12px; border: 1px solid rgba(218, 195, 135, .16); border-radius: var(--radius); background: rgba(0, 0, 0, .18); }
    .fighter h3 { margin: 0 0 8px; color: #f1d68a; font-size: 16px; }
    .status-row { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; margin-top: 9px; }
    .status { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid rgba(218, 195, 135, .18); color: var(--muted); background: rgba(255, 255, 255, .04); font-size: 12px; }
    .status.good { border-color: rgba(101, 192, 142, .35); color: #bdf0d0; background: rgba(101, 192, 142, .1); }
    .status.bad { border-color: rgba(214, 106, 95, .4); color: #ffb9b1; background: rgba(214, 106, 95, .1); }
    .status.rare { border-color: rgba(177, 138, 218, .4); color: #dbc8ff; background: rgba(177, 138, 218, .1); }
    .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .reward-panel { margin-top: 12px; padding: 12px; border: 1px solid rgba(218, 195, 135, .18); border-radius: var(--radius); background: rgba(0, 0, 0, .18); }
    .reward-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .reward-choice { min-height: 118px; padding: 10px; text-align: left; border: 1px solid rgba(218, 195, 135, .16); border-radius: var(--radius); background: rgba(255, 255, 255, .04); color: var(--ink); }
    .reward-choice.good { border-color: rgba(101, 192, 142, .35); }
    .reward-choice.rare { border-color: rgba(177, 138, 218, .38); }
    .reward-choice strong { display: block; color: #f1d68a; font-size: 14px; }
    .reward-choice span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .skill-list, .log, .inventory { display: grid; gap: 8px; }
    .build-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .build-card { padding: 10px; border: 1px solid rgba(218, 195, 135, .14); border-radius: var(--radius); background: rgba(255, 255, 255, .035); }
    .build-card.active { border-color: rgba(101, 192, 142, .45); background: rgba(101, 192, 142, .09); }
    .build-card strong { display: flex; justify-content: space-between; gap: 8px; color: #f1d68a; font-size: 13px; }
    .build-card.active strong { color: #bdf0d0; }
    .build-card span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .insight-list { display: grid; gap: 8px; margin-top: 8px; }
    .insight-card { width: 100%; min-height: 92px; padding: 10px; text-align: left; border: 1px solid rgba(218, 195, 135, .14); border-radius: var(--radius); background: rgba(255, 255, 255, .035); color: var(--ink); }
    .insight-card.learned { border-color: rgba(101, 192, 142, .4); background: rgba(101, 192, 142, .08); }
    .insight-card.locked { opacity: .55; filter: grayscale(.65); }
    .insight-card strong { display: flex; justify-content: space-between; gap: 8px; color: #f1d68a; font-size: 13px; }
    .insight-card.learned strong { color: #bdf0d0; }
    .insight-card span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .skill-btn { width: 100%; padding: 10px; text-align: left; border: 1px solid rgba(218, 195, 135, .16); border-radius: var(--radius); background: rgba(255, 255, 255, .04); color: var(--ink); transition: transform .14s ease, border-color .14s ease, background .14s ease; }
    .skill-btn strong { display: flex; justify-content: space-between; gap: 8px; color: #f1d68a; font-size: 14px; }
    .skill-btn p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .log { max-height: 330px; overflow: auto; padding-right: 4px; }
    .log-line { padding: 8px 9px; border-left: 3px solid rgba(216, 183, 106, .45); border-radius: 0 var(--radius) var(--radius) 0; background: rgba(255, 255, 255, .035); color: var(--muted); font-size: 12px; line-height: 1.55; }
    .log-line.good { border-left-color: var(--jade); color: #c7ebd5; }
    .log-line.bad { border-left-color: var(--red); color: #ffc0bb; }
    .log-line.rare { border-left-color: var(--purple); color: #dbc8ff; }
    .inventory .tile { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .inventory .tile b { font-size: 14px; }
    .resource-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .resource-actions .btn { min-height: 34px; padding: 0 8px; font-size: 12px; }
    .objective-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-bottom: 14px; }
    .objective { min-height: 82px; padding: 10px; border: 1px solid rgba(218, 195, 135, .14); border-radius: var(--radius); background: rgba(255, 255, 255, .035); }
    .objective.done { border-color: rgba(101, 192, 142, .38); background: rgba(101, 192, 142, .08); }
    .objective strong { display: block; margin-bottom: 5px; color: #f1d68a; font-size: 13px; }
    .objective.done strong { color: #bdf0d0; }
    .objective span { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .advice-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-bottom: 14px; }
    .advice-card { min-height: 82px; padding: 10px; border: 1px solid rgba(218, 195, 135, .16); border-radius: var(--radius); background: rgba(255, 255, 255, .04); }
    .advice-card.primary { border-color: rgba(101, 192, 142, .4); background: rgba(101, 192, 142, .08); }
    .advice-card.danger { border-color: rgba(214, 106, 95, .38); background: rgba(214, 106, 95, .09); }
    .advice-card strong { display: block; color: #f1d68a; font-size: 13px; }
    .advice-card.primary strong { color: #bdf0d0; }
    .advice-card.danger strong { color: #ffb9b1; }
    .advice-card span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .footer-note { margin: 14px 0 0; color: var(--faint); font-size: 12px; line-height: 1.6; text-align: center; }

    @media (max-width: 1120px) {
      .layout { grid-template-columns: 1fr; }
      .hero-visual { width: 34%; opacity: .42; }
      .combat { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .app { width: min(100% - 18px, 1440px); padding-top: 10px; }
      .topbar { grid-template-columns: 1fr; }
      .top-actions { justify-content: stretch; }
      .top-actions .btn, .hero-actions .btn, .actions .btn { flex: 1 1 auto; }
      .zones { grid-template-columns: 1fr; }
      .commission-list { grid-template-columns: 1fr; }
      .trial-list { grid-template-columns: 1fr; }
      .objective-list { grid-template-columns: 1fr; }
      .advice-list { grid-template-columns: 1fr; }
      .build-list { grid-template-columns: 1fr; }
      .reward-choices { grid-template-columns: 1fr; }
      .resource-actions { grid-template-columns: 1fr; }
      .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { min-height: 0; }
      .hero-visual { display: none; }
      .brand p { white-space: normal; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="seal" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M32 4 52 16v22c0 11-8 18-20 22C20 56 12 49 12 38V16L32 4Z" fill="none" stroke="#d8b76a" stroke-width="4"/>
            <path d="M20 39c9-2 12-9 12-22 0 13 3 20 12 22-6 2-10 5-12 11-2-6-6-9-12-11Z" fill="#65c08e"/>
          </svg>
        </div>
        <div>
          <h1>凡骨问道</h1>
          <p>开放式修仙文字战斗养成原型</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn" id="saveBtn">保存</button>
        <button class="btn" id="loadBtn">读取</button>
        <button class="btn danger" id="resetBtn">重开</button>
      </div>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="pad">
          <div class="section-title">角色 <span class="pill green" id="sectPill">散修</span></div>
          <div class="stats">
            <div class="stat">
              <div class="stat-head"><span>气血</span><span id="hpText"></span></div>
              <div class="bar hp"><span id="hpBar"></span></div>
            </div>
            <div class="stat">
              <div class="stat-head"><span>真气</span><span id="qiText"></span></div>
              <div class="bar qi"><span id="qiBar"></span></div>
            </div>
            <div class="stat">
              <div class="stat-head"><span>修为</span><span id="cultText"></span></div>
              <div class="bar cult"><span id="cultBar"></span></div>
            </div>
            <div class="stat">
              <div class="stat-head"><span>心魔</span><span id="demonText"></span></div>
              <div class="bar demon"><span id="demonBar"></span></div>
            </div>
          </div>

          <div class="grid2" style="margin-top: 12px;">
            <div class="tile"><b id="realmText">凡人</b><span>境界</span></div>
            <div class="tile"><b id="powerText">0</b><span>战力</span></div>
            <div class="tile"><b id="atkText">0</b><span>攻击</span></div>
            <div class="tile"><b id="defText">0</b><span>防御</span></div>
            <div class="tile"><b id="agiText">0</b><span>身法</span></div>
            <div class="tile"><b id="repText">0</b><span>声望</span></div>
            <div class="tile"><b id="weaponText">竹剑</b><span>武器</span></div>
            <div class="tile"><b id="armorText">布衣</b><span>护具</span></div>
          </div>
        </div>
        <div class="pad" style="border-top: 1px solid var(--line);">
          <div class="section-title">资源 <span class="subtle" id="demonHint"></span></div>
          <div class="inventory" id="inventory"></div>
          <div class="resource-actions">
            <button class="btn" id="healBtn">服药疗伤</button>
            <button class="btn" id="forgeBtn">锻造装备</button>
            <button class="btn" id="refineBtn">炼化灵石</button>
            <button class="btn" id="calmBtn">镇心调息</button>
            <button class="btn" id="prepHpBtn">炼回春丹</button>
            <button class="btn" id="prepQiBtn">炼回气丹</button>
            <button class="btn" id="prepWardBtn">制护身符</button>
          </div>
        </div>
      </aside>

      <section class="panel">
        <div class="hero">
          <h2 id="mainTitle">凡骨未醒，道在荒林</h2>
          <p id="mainDesc">你只是山村里的普通人。灵根未显，身无长物，但山外有妖邪、破庙有残页、青云山道有人收徒。</p>
          <div class="hero-actions">
            <button class="btn primary" id="exploreBtn">探索当前地图</button>
            <button class="btn" id="cultivateBtn">静修吐纳</button>
            <button class="btn" id="breakBtn">尝试突破</button>
            <button class="btn" id="trialBtn">外门试炼</button>
          </div>
          <svg class="hero-visual" viewBox="0 0 520 220" aria-hidden="true">
            <path d="M0 190c60-45 88-82 137-112 32 37 55 65 86 97 42-78 89-121 138-153 45 77 94 116 159 168v30H0Z" fill="rgba(101,192,142,.18)" stroke="rgba(216,183,106,.34)" stroke-width="3"/>
            <path d="M71 182c56-20 87-45 120-78 25 28 44 47 73 70 26-56 58-84 95-111 33 48 61 79 99 111" fill="none" stroke="rgba(244,236,216,.25)" stroke-width="2"/>
            <circle cx="361" cy="42" r="18" fill="rgba(216,183,106,.45)"/>
          </svg>
        </div>

        <div class="pad">
          <div class="section-title">目标链 <span class="subtle" id="goalHint"></span></div>
          <div class="objective-list" id="objectives"></div>
          <div class="section-title">道途指引 <span class="subtle" id="adviceHint"></span></div>
          <div class="advice-list" id="adviceList"></div>
          <div class="section-title">地图 <span class="subtle" id="mapHint"></span></div>
          <div class="zones" id="zones"></div>
          <div class="section-title" style="margin-top: 14px;">门派委托 <span class="subtle" id="commissionHint"></span></div>
          <div class="commission-list" id="commissions"></div>
          <div class="section-title" style="margin-top: 14px;">外山试炼 <span class="subtle" id="trialHint"></span></div>
          <div class="trial-list" id="trialStages"></div>

          <div class="combat" id="combatBox" hidden>
            <div class="fighter">
              <h3>你</h3>
              <div class="stat">
                <div class="stat-head"><span>气血</span><span id="battlePlayerHp"></span></div>
              <div class="bar hp"><span id="battlePlayerHpBar"></span></div>
              </div>
              <div class="status-row" id="playerStatuses"></div>
            </div>
            <div class="fighter">
              <h3 id="enemyName">敌人</h3>
              <div class="stat">
                <div class="stat-head"><span>气血</span><span id="enemyHp"></span></div>
                <div class="bar hp"><span id="enemyHpBar"></span></div>
              </div>

      if (score >= 96) return 3;
      if (score >= 54) return 2;
      if (score >= 22) return 1;
      return 0;
    }

    function dominantBuild() {
      const scores = buildScores();
      return Object.keys(scores).sort((a, b) => scores[b] - scores[a])[0];
    }

      const level = buildLevel(id);

        dmg: level * 3,
        chance: level * .08,

      if (hasInsight(defn.id)) return false;
      if (state.realm < defn.needRealm) return false;
      if (skill(defn.reqSkill) < defn.reqLevel) return false;
      return Object.entries(defn.cost || {}).every(([key, value]) => (state[key] || 0) >= value);

      if (hasInsight(defn.id)) return '已领悟';
      if (state.realm < defn.needRealm) return `需要${realms[defn.needRealm].name}`;
      if (skill(defn.reqSkill) < defn.reqLevel) return `需要${skillDefs[defn.reqSkill].name} ${defn.reqLevel}级`;
      return costText(defn.cost);
    }

    function learnInsight(id) {
      const defn = insightDefs.find((item) => item.id === id);
      if (!defn) return;
      if (hasPendingDecision()) return log('先处理当前抉择，再领悟神通。', 'bad');
      if (state.combat) return log('战斗中不能领悟神通。', 'bad');
      if (hasInsight(id)) return log(`${defn.name}已经领悟。`, 'bad');
      if (!canLearnInsight(defn)) return log(`${defn.name}尚未满足条件：${insightNeedText(defn)}。`, 'bad');
      Object.entries(defn.cost || {}).forEach(([key, value]) => { state[key] -= value; });
      insights()[id] = true;
      state.hp = clamp(state.hp + 10, 1, maxHp());
      state.qi = clamp(state.qi + 8, 0, maxQi());
      log(`你领悟神通：${defn.name}。`, 'rare');
    }

    function canPay(cost) {
      return Object.entries(cost || {}).every(([key, value]) => (state[key] || 0) >= value);
    }

    function payCost(cost) {
      Object.entries(cost || {}).forEach(([key, value]) => { state[key] -= value; });
    }

    function prepareSupply(id) {
      const defn = supplyDefs[id];
      if (!defn) return;
      if (hasPendingDecision()) return log('先处理当前抉择，再整备丹符。', 'bad');
      if (state.combat) return log('战斗中不能整备丹符。', 'bad');
      if (!canPay(defn.cost)) return log(`炼制${defn.name}需要${costText(defn.cost)}。`, 'bad');
      payCost(defn.cost);
      supplies()[id] = (supplies()[id] || 0) + 1;
      log(`你整备了一份${defn.name}。${defn.desc}`, 'good');
    }

    function useSupply(id) {
      const c = state.combat;
      const defn = supplyDefs[id];
      if (!c || !defn) return false;
      if ((supplies()[id] || 0) <= 0) { log(`${defn.name}已经用尽。`, 'bad'); return false; }
      supplies()[id] -= 1;
      if (id === 'hpPill') {
        const healHp = 34 + state.realm * 10 + skill('qingmu') * 3;
        state.hp = clamp(state.hp + healHp, 1, maxHp());
        c.playerStatus.bleed = Math.max(0, (c.playerStatus.bleed || 0) - 1);
        c.playerStatus.poison = Math.max(0, (c.playerStatus.poison || 0) - 1);
        log(`你服下回春丹，气血恢复 ${healHp}，伤毒稍缓。`, 'good');
      }
      if (id === 'qiPill') {
        const gainQi = 22 + state.realm * 8 + skill('qingmu') * 2;
        state.qi = clamp(state.qi + gainQi, 0, maxQi());
        c.playerStatus.sealed = 0;
        log(`你含化回气丹，真气 +${gainQi}，封气被冲散。`, 'good');
      }
      if (id === 'ward') {
        addStatus('player', 'shield', 4 + skill('stone'));
        addStatus('player', 'focus', 2);
        log('你拍开护身符，符光护住周身，并稳住下一式。', 'rare');
      }
      return true;
    }

    function log(text, type = '') {
      state.log.unshift({ text, type });
      state.log = state.log.slice(0, 80);
      render();
    }

    function normalizeLog() {
      state.log = state.log.map((entry) => typeof entry === 'string' ? { text: entry, type: '' } : entry);
    }

    function migrateState(raw) {
      const base = initialState();
      const input = raw && typeof raw === 'object' ? raw : {};
      const migrated = { ...base, ...input };
      migrated.saveVersion = SAVE_VERSION;
      migrated.equipment = { ...base.equipment, ...(input.equipment || {}) };
      migrated.skills = { ...base.skills, ...(input.skills || {}) };
      migrated.insights = { ...base.insights, ...(input.insights || {}) };
      migrated.supplies = { ...base.supplies, ...(input.supplies || {}) };
      migrated.pendingReward = input.pendingReward || null;
      migrated.pendingEncounter = input.pendingEncounter || null;
      migrated.log = Array.isArray(input.log) ? input.log : base.log;
      for (const key of ['realm', 'hp', 'qi', 'cult', 'demon', 'silver', 'herbs', 'pages', 'jade', 'ore', 'spirit', 'contribution', 'commissionsDone', 'trialStage', 'demonTrials', 'reputation']) {
        if (!Number.isFinite(migrated[key])) migrated[key] = base[key];
      }
      migrated.realm = clamp(Math.round(migrated.realm), 0, realms.length - 1);
      if (!maps.some((map) => map.id === migrated.selectedMap)) migrated.selectedMap = base.selectedMap;
      if (input.combat) {
        migrated.combat = {
          enemyKey: input.combat.enemyKey && enemies[input.combat.enemyKey] ? input.combat.enemyKey : 'wildDog',
          mode: input.combat.mode || 'normal',
          commissionId: input.combat.commissionId || '',
          trialStageIndex: Number.isInteger(input.combat.trialStageIndex) ? input.combat.trialStageIndex : -1,
          demonBefore: input.combat.demonBefore || 0,
          enemyHp: Number.isFinite(input.combat.enemyHp) ? input.combat.enemyHp : 1,
          enemyMaxHp: Number.isFinite(input.combat.enemyMaxHp) ? input.combat.enemyMaxHp : 1,
          guard: !!input.combat.guard,
          poison: input.combat.poison || 0,
          playerGuard: !!input.combat.playerGuard,
          playerStatus: { bleed: 0, poison: 0, stun: 0, sealed: 0, shield: 0, focus: 0, ...(input.combat.playerStatus || {}) },
          enemyStatus: { bleed: 0, poison: 0, break: 0, stun: 0, shield: 0, rage: 0, ...(input.combat.enemyStatus || {}) }
        };
      } else {
        migrated.combat = null;
      }
      return migrated;
    }

    function canEnter(map) { return state.realm >= map.needRealm; }

    function selectMap(id) {
      const map = maps.find((m) => m.id === id);
      if (!map || !canEnter(map)) return;
      state.selectedMap = id;
      render();
    }

    function hasPendingReward() {
      return !!state.pendingReward;
    }

    function hasPendingDecision() {
      return !!state.pendingReward || !!state.pendingEncounter;
    }

    function demonBand() {
      if (state.demon >= 80) return '劫临';
      if (state.demon >= 60) return '失控';
      if (state.demon >= 35) return '躁动';
      return '平稳';
    }

    function checkDemonSurge(reason = '') {
      if (state.combat || hasPendingDecision()) return false;
      if (state.demon < 60) return false;
      const forced = state.demon >= 80;
      const chance = state.demon >= 70 ? .45 : .25;
      if (!forced && Math.random() >= chance) return false;
      startCombat('mindDemon', 'demonSurge', { demonBefore: state.demon });
      const note = reason ? `因${reason}牵动杂念，` : '';
      log(`${note}心魔化形拦路。若能压过它，心魔会大幅回落。`, 'rare');
      return true;
    }

    function explore() {
      if (hasPendingDecision()) return log('先处理当前抉择，再继续行动。', 'bad');
      if (state.combat) return log('战斗未结束，不能离开当前局面。', 'bad');
      const map = maps.find((m) => m.id === state.selectedMap);
      if (!canEnter(map)) return log('境界不足，贸然前往只会送命。', 'bad');
      const roll = Math.random();
      if (roll < 0.68) {
        const key = map.enemies[rand(0, map.enemies.length - 1)];
        startCombat(key);
      } else if (roll < 0.86) {
        const gain = rand(9, 18) + state.realm * 8;
        state.cult += gain;
        state.silver += rand(2, 8);
        if (Math.random() < .45) state.herbs += 1;
        log(`你在${map.name}寻得一处清净地，修为 +${gain}。`, 'good');
      } else {
        triggerEvent(map.id);
      }
      checkDemonSurge('山野异遇');
      render();
    }

    function triggerEvent(mapId) {
      const event = encounterDefs[mapId] || encounterDefs.woods;
      state.pendingEncounter = { mapId, title: event.title, desc: event.desc, choices: event.choices };
      log(`你遇到境遇：${event.title}。`, 'rare');
    }

    function applyEncounterChoice(id) {
      const pending = state.pendingEncounter;
      if (!pending) return;
      const choice = pending.choices.find((item) => item.id === id);
      if (!choice) return;
      if (choice.cost && !canPay(choice.cost)) return log(`${choice.name}需要${costText(choice.cost)}。`, 'bad');
      if (choice.cost) payCost(choice.cost);
      applyRewardEffect(choice.data || {});
      if (choice.sect && state.sect === '散修') state.sect = choice.sect;
      state.pendingEncounter = null;
      log(`你选择${choice.name}，${pending.title}一事落定。`, choice.type || '');
      checkDemonSurge('境遇余波');
      render();
    }

    function canStartCommission(item) {
      if (state.sect === '散修') return false;
      if (state.realm < item.needRealm) return false;
      if (item.cost) return Object.entries(item.cost).every(([key, value]) => (state[key] || 0) >= value);
      return true;
    }

    function startCommission(id) {
      const item = commissionDefs.find((entry) => entry.id === id);
      if (!item) return;
      if (hasPendingDecision()) return log('先处理当前抉择，再接门派委托。', 'bad');
      if (state.combat) return log('战斗未结束，不能接门派委托。', 'bad');
      if (state.sect === '散修') return log('你尚未入青云外山，不能接门派委托。', 'bad');
      if (state.realm < item.needRealm) return log(`${item.name}需要${realms[item.needRealm].name}境界。`, 'bad');
      if (item.cost && !canStartCommission(item)) return log(`${item.name}需要${item.need}。`, 'bad');
      if (item.cost) Object.entries(item.cost).forEach(([key, value]) => { state[key] -= value; });
      if (item.kind === 'support') {
        applyCommissionReward(item.id);
        log(`你完成${item.name}，外山执事记下一笔功劳。`, 'good');
        render();
        return;
      }
      startCombat(item.enemy, 'commission', { commissionId: item.id });
    }

    function applyCommissionReward(id) {
      const item = commissionDefs.find((entry) => entry.id === id);
      if (!item) return;
      applyRewardEffect(item.gain || {});
      state.commissionsDone = (state.commissionsDone || 0) + 1;
      if (state.sect === '青云杂役' && state.commissionsDone >= 2 && state.contribution >= 12) {
        state.sect = '青云外山记名';
        log('你数次完成外山勤务，终于被记入青云名册。', 'good');
      }
    }

    function canStartTrialStage(index) {
      const stage = trialStageDefs[index];
      if (!stage) return false;
      if (state.sect === '散修') return false;
      if ((state.trialStage || 0) !== index) return false;
      if (state.realm < stage.needRealm) return false;
      if (power() < stage.needPower) return false;
      return state.contribution >= stage.cost;
    }

    function trialStageNeedText(index) {
      const stage = trialStageDefs[index];
      if (!stage) return '已完成';
      if (state.sect === '散修') return '需要入青云外山';
      if ((state.trialStage || 0) > index) return '已通过';
      if ((state.trialStage || 0) < index) return '需先通过前阶';
      if (state.realm < stage.needRealm) return `需要${realms[stage.needRealm].name}`;
      if (power() < stage.needPower) return `战力 ${stage.needPower}`;
      if (state.contribution < stage.cost) return `贡献 ${stage.cost}`;
      return `消耗贡献 ${stage.cost}`;
    }

    function startTrialStage(index) {
      const stage = trialStageDefs[index];
      if (!stage) return;
      if (hasPendingDecision()) return log('先处理当前抉择，再入外山试炼。', 'bad');
      if (state.combat) return log('战斗未结束，不能进入外山试炼。', 'bad');
      if (!canStartTrialStage(index)) return log(`${stage.name}尚未满足条件：${trialStageNeedText(index)}。`, 'bad');
      state.contribution -= stage.cost;
      startCombat(stage.enemy, 'trialStage', { trialStageIndex: index });
      state.combat.enemyHp += stage.boost;
      state.combat.enemyMaxHp += stage.boost;
      log(`${stage.name}开启，阵法压下退路。`, 'rare');
    }

    function applyTrialStageReward(index) {
      const stage = trialStageDefs[index];
      if (!stage) return;
      applyRewardEffect(stage.gain || {});
      state.trialStage = Math.max(state.trialStage || 0, index + 1);
      log(`你通过${stage.name}，试炼进度推进到 ${state.trialStage}/${trialStageDefs.length}。`, 'rare');
    }

    function startCombat(enemyKey, mode = 'normal', extra = {}) {
      const base = enemies[enemyKey];
      state.combat = {
        enemyKey,
        mode,
        commissionId: extra.commissionId || '',
        trialStageIndex: Number.isInteger(extra.trialStageIndex) ? extra.trialStageIndex : -1,
        demonBefore: extra.demonBefore || 0,
        enemyHp: base.hp + state.realm * 8,
        enemyMaxHp: base.hp + state.realm * 8,
        guard: false,
        poison: 0,
        playerGuard: false,
        playerStatus: { bleed: 0, poison: 0, stun: 0, sealed: 0, shield: 0, focus: 0 },
        enemyStatus: { bleed: 0, poison: 0, break: 0, stun: 0, shield: base.trait === 'armor' ? 2 : 0, rage: 0 }
      };
      log(`你遭遇了${base.name}。${base.traitText ? ` ${base.traitText}` : ''}`, mode === 'trial' || mode === 'commission' || mode === 'trialStage' || mode === 'demonSurge' ? 'rare' : '');
      render();
    }

    function statusValue(side, key) {
      const c = state.combat;
      if (!c) return 0;
      const bucket = side === 'player' ? (c.playerStatus || {}) : (c.enemyStatus || {});
      return bucket[key] || 0;
    }

    function addStatus(side, key, amount) {
      const c = state.combat;
      if (!c.playerStatus) c.playerStatus = {};
      if (!c.enemyStatus) c.enemyStatus = {};
      const bucket = side === 'player' ? c.playerStatus : c.enemyStatus;
      bucket[key] = Math.max(bucket[key] || 0, amount);
    }

    function tickRoundStart() {
      const c = state.combat;
      if (!c) return false;
      if (!c.playerStatus) c.playerStatus = { bleed: 0, poison: 0, stun: 0, sealed: 0, shield: 0, focus: 0 };
      if (!c.enemyStatus) c.enemyStatus = { bleed: 0, poison: 0, break: 0, stun: 0, shield: 0, rage: 0 };
      let ended = false;
      if (c.playerStatus.bleed > 0) {
        const dmg = 4 + state.realm * 2;
        state.hp -= dmg;
        c.playerStatus.bleed -= 1;
        log(`流血撕扯伤口，你失去 ${dmg} 点气血。`, 'bad');
      }
      if (c.playerStatus.poison > 0) {
        const dmg = 5 + c.playerStatus.poison;
        state.hp -= dmg;
        c.playerStatus.poison -= 1;
        state.demon += 1;
        log(`毒劲入脉，你失去 ${dmg} 点气血，心魔 +1。`, 'bad');
      }
      if (c.enemyStatus.bleed > 0) {
        const dmg = 5 + skill('sword');
        c.enemyHp -= dmg;
        c.enemyStatus.bleed -= 1;
        log(`敌人伤口迸裂，受到 ${dmg} 点流血伤害。`, 'good');
      }
      if (c.enemyStatus.poison > 0) {
        const dmg = 4 + skill('qingmu');
        c.enemyHp -= dmg;
        c.enemyStatus.poison -= 1;
        log(`毒性扩散，敌人受到 ${dmg} 点伤害。`, 'good');
      }
      if (state.hp <= 0) { loseCombat(); ended = true; }
      else if (c.enemyHp <= 0) { winCombat(); ended = true; }
      return ended;
    }

    function decayEndTurn() {
      const c = state.combat;
      if (!c) return;
      if (!c.playerStatus) c.playerStatus = {};
      if (!c.enemyStatus) c.enemyStatus = {};
      for (const key of ['break', 'stun', 'shield', 'rage']) c.enemyStatus[key] = Math.max(0, (c.enemyStatus[key] || 0) - 1);
      for (const key of ['stun', 'sealed', 'shield', 'focus']) c.playerStatus[key] = Math.max(0, (c.playerStatus[key] || 0) - 1);
    }

    function applyEnemyTraitAfterHit(e) {
      const c = state.combat;
      if (!c) return;
      if (e.trait === 'bleed' && Math.random() < .35) { addStatus('player', 'bleed', 2); log(`${e.name}撕开伤口，你陷入流血。`, 'bad'); }
      if (e.trait === 'stun' && Math.random() < .24) { addStatus('player', 'stun', 1); log(`${e.name}一棍砸乱你的架势，你下次行动受阻。`, 'bad'); }
      if (e.trait === 'poison' && Math.random() < .42) { addStatus('player', 'poison', 3); log(`${e.name}毒劲入脉，中毒持续生效。`, 'bad'); }
      if (e.trait === 'rot' && Math.random() < .38) { state.demon += 2; log('尸气扰神，心魔 +2。', 'bad'); }
      if (e.trait === 'break' && Math.random() < .34) { addStatus('player', 'sealed', 1); log(`${e.name}身形如血线，逼得你真气一滞。`, 'bad'); }
      if (e.trait === 'seal' && Math.random() < .32) { addStatus('player', 'sealed', 2); log('残碑符纹压住经脉，你暂时难以催动功法。', 'bad'); }
      if (e.trait === 'demon' && Math.random() < .45) { state.demon += 3; addStatus('player', 'poison', 1); log('心魔幻身照见你的杂念，心魔 +3。', 'bad'); }
    }

    function playerAction(action) {
      if (!state.combat) return;
      if (tickRoundStart()) return;
      const c = state.combat;
      const e = enemies[c.enemyKey];
      if (c.playerStatus.stun > 0 && action !== 'guard' && !supplyDefs[action]) {
        c.playerStatus.stun = 0;
        log('你被眩晕压住动作，只能勉强稳住身形。', 'bad');
        enemyTurn();
        render();
        return;
      }
      if (supplyDefs[action]) {
        if (!useSupply(action)) return;
        enemyTurn();
        render();
        return;
      }
      if (action === 'attack') {
        const swordPath = buildBonus('sword');
        let dmg = Math.max(1, atk() + rand(-2, 4) - e.def - (statusValue('enemy', 'shield') ? 5 : 0));
        if (statusValue('enemy', 'break')) dmg += 6 + skill('sword') * 2 + swordPath.dmg;
        if (statusValue('player', 'focus')) dmg += 5 + skill('step');
        if (hasInsight('swordTrace') && statusValue('enemy', 'break')) { dmg += 10 + skill('sword'); addStatus('enemy', 'break', 2); log('青锋留痕压住旧伤，破绽被再次撕开。', 'good'); }
        if (skill('sword') >= 3 && Math.random() < .38 + swordPath.chance) { dmg += skill('sword') * 2 + swordPath.level * 2; addStatus('enemy', 'break', 2 + (swordPath.level >= 2 ? 1 : 0)); log('青锋三式寻到破绽，敌人防线松动。', 'good'); }
        if (skill('sword') >= 5 && Math.random() < .28 + swordPath.chance) { addStatus('enemy', 'bleed', 2 + (swordPath.level >= 3 ? 1 : 0)); log('剑锋割开血口，敌人陷入流血。', 'good'); }
        c.enemyHp -= dmg;
        log(`你挥出一击，造成 ${dmg} 点伤害。`);
      }
      if (action === 'art') {
        const swordPath = buildBonus('sword');
        const qingmuPath = buildBonus('qingmu');
        const cost = 8;
        if (statusValue('player', 'sealed')) return log('真气被封，暂时无法催动功法。', 'bad');
        if (state.qi < cost) return log('真气不足，功法催动失败。', 'bad');
        state.qi -= cost;
        let dmg = Math.max(2, Math.round(atk() * 1.55 + skill('sword') * 4 - e.def * .7));
        if (statusValue('enemy', 'break')) dmg += 10 + swordPath.dmg;
        c.enemyHp -= dmg;
        if (skill('qingmu') >= 3) { addStatus('player', 'shield', 2 + qingmuPath.level); log('青木真气护住经脉，你获得护体。', 'good'); }
        if (skill('qingmu') >= 5) { state.hp = clamp(state.hp + 6 + skill('qingmu') + qingmuPath.sustain + (hasInsight('leafVein') ? 8 : 0), 0, maxHp()); log('青木吐纳诀回护经脉，气血小幅恢复。', 'good'); }
        if (qingmuPath.level >= 2) state.qi = clamp(state.qi + 2 + qingmuPath.level, 0, maxQi());
        if (hasInsight('steleBreath') && Math.random() < .35) { addStatus('enemy', 'stun', 1); log('残碑定息镇住敌势，敌人下次反击受阻。', 'rare'); }
        log(`你催动功法，真气化劲，造成 ${dmg} 点伤害。`, 'good');
      }
      if (action === 'guard') {
        const qingmuPath = buildBonus('qingmu');
        const stonePath = buildBonus('stone');
        c.playerGuard = true;
        const gain = 7 + skill('stone') * 2 + qingmuPath.sustain;
        state.qi = clamp(state.qi + gain, 0, maxQi());
        addStatus('player', 'shield', (skill('stone') >= 3 ? 3 : 2) + stonePath.level + (hasInsight('rockMirror') ? 2 : 0));
        if (skill('step') >= 3) addStatus('player', 'focus', 2);
        log(`你收势护体，真气 +${gain}，并获得护体。`, 'good');
      }
      if (action === 'jade') {
        const jadePath = buildBonus('jade');
        if (skill('jade') <= 0) return log('你尚未掌握血玉残法。', 'bad');
        const cost = hasInsight('bloodOath') ? 9 : 12;
        if (state.qi < cost) return log('真气不足，血玉没有回应。', 'bad');
        state.qi -= cost;
        const dmg = Math.max(8, Math.round(atk() * (2.2 + jadePath.level * .12) + state.jade * 4 + state.demon * .45 + jadePath.dmg + (hasInsight('bloodOath') ? 12 : 0)));
        c.enemyHp -= dmg;
        addStatus('enemy', 'break', 2 + (jadePath.level >= 2 ? 1 : 0));
        addStatus('enemy', 'bleed', 2 + (jadePath.level >= 3 ? 1 : 0));
        if (hasInsight('bloodOath')) addStatus('enemy', 'poison', 2);
        const demonGain = Math.max(1, (jadePath.level >= 3 ? 3 : 2) - (hasInsight('bloodOath') ? 1 : 0));
        state.demon += demonGain;
        log(`血玉发烫，邪力贯体，造成 ${dmg} 点伤害，并撕开敌人破绽，心魔 +${demonGain}。`, 'rare');
      }
      if (c.enemyHp <= 0) return winCombat();
      enemyTurn();
      render();
    }

    function enemyTurn() {
      const c = state.combat;
      const e = enemies[c.enemyKey];
      if (c.enemyStatus.stun > 0) {
        c.enemyStatus.stun = 0;
        log(`${e.name}被震住一息，未能反击。`, 'good');
        decayEndTurn();
        return;
      }
      if (e.trait === 'guard' && Math.random() < .32) { addStatus('enemy', 'shield', 2); log(`${e.name}架起护体姿态。`, 'bad'); }
      if (e.trait === 'rage' && c.enemyHp < c.enemyMaxHp * .42 && !c.enemyStatus.rage) { c.enemyStatus.rage = 4; log(`${e.name}被逼入狂暴，攻击提升。`, 'bad'); }
      let dmg = Math.max(1, e.atk + rand(-2, 3) + (c.enemyStatus.rage ? 7 : 0) - def());
      const stonePath = buildBonus('stone');
      const guarded = c.playerGuard;
      if (hasInsight('cloudStep') && statusValue('player', 'focus') && Math.random() < .22 + skill('step') * .015) {
        c.playerGuard = false;
        log('踏云避劫牵开身位，你避开了这次反击。', 'good');
        decayEndTurn();
        return;
      }
      if (guarded) dmg = Math.ceil(dmg * Math.max(.22, .42 - stonePath.level * .05));
      if (statusValue('player', 'shield')) dmg = Math.max(1, dmg - 6 - skill('stone') - stonePath.guard);
      state.hp -= dmg;
      c.playerGuard = false;
      log(`${e.name}反击，造成 ${dmg} 点伤害。`, 'bad');
      if (state.hp <= 0) return loseCombat();
      if (guarded && stonePath.level >= 1) {
        const counter = 3 + skill('stone') + stonePath.level * 2 + (hasInsight('rockMirror') ? 7 : 0);
        c.enemyHp -= counter;
        log(`山石护体反震敌势，回敬 ${counter} 点伤害。`, 'good');
        if (c.enemyHp <= 0) return winCombat();
      }
      applyEnemyTraitAfterHit(e);
      decayEndTurn();
      if (c.enemyHp <= 0) return winCombat();
      if (state.hp <= 0) loseCombat();
    }

    function winCombat() {
      const c = state.combat;
      const e = enemies[c.enemyKey];
      if (c.mode === 'break') breakthroughSuccess();
      else if (c.mode === 'trial') trialSuccess();
      else if (c.mode === 'commission') { applyCommissionReward(c.commissionId); queueReward(e); }
      else if (c.mode === 'trialStage') { applyTrialStageReward(c.trialStageIndex); queueReward(e); }
      else if (c.mode === 'demonSurge') demonSurgeSuccess(c.demonBefore);
      else queueReward(e);
      state.combat = null;
      state.hp = clamp(state.hp + Math.ceil(maxHp() * .08), 1, maxHp());
      state.qi = clamp(state.qi + 5, 0, maxQi());
      render();
    }

    function demonSurgeSuccess(before) {
      const reduce = 28 + state.realm * 6 + (hasInsight('leafVein') ? 6 : 0);
      state.demon = Math.max(0, state.demon - reduce);
      state.demonTrials = (state.demonTrials || 0) + 1;
      state.cult += 25 + state.realm * 18;
      if (before >= 80) state.pages += 1;
      log(`你斩退心魔幻身，心神短暂清明，心魔 -${reduce}。`, 'rare');
    }

    function queueReward(enemy) {
      const base = {
        cult: enemy.cult,
        silver: enemy.silver || 0,
        herbs: enemy.herbs || 0,
        pages: enemy.pages || 0,
        jade: enemy.jade || 0,
        ore: enemy.ore || 0,
        spirit: enemy.spirit || 0,
        contribution: enemy.contribution || 0,
        reputation: enemy.rep || 0,
        demon: enemy.demon || 0
      };
      state.pendingReward = { enemy: enemy.name, base, choices: rewardChoices(enemy, base) };
      log(`你击败${enemy.name}，战利品尚未分配。`, 'good');
    }

    function rewardChoices(enemy, base) {
      const active = dominantBuild();
      const choices = [
        {
          id: 'loot',
          name: '搜检战利',
          type: 'good',
          desc: `拿稳资源：银钱 +${6 + state.realm * 4}，药材 +1。`,
          data: { silver: 6 + state.realm * 4, herbs: 1 }
        },
        {
          id: 'insight',
          name: '复盘招式',
          type: 'good',
          desc: `沉淀战斗经验：修为 +${Math.ceil(base.cult * .55)}，当前主流派得势。`,
          data: { cult: Math.ceil(base.cult * .55), build: active }
        },
        {
          id: 'risk',
          name: enemy.trait === 'demon' || enemy.trait === 'rot' || enemy.trait === 'break' ? '窥其邪异' : '逼问线索',
          type: 'rare',
          desc: enemy.trait === 'demon' || enemy.trait === 'rot' || enemy.trait === 'break'
            ? '有机会得血玉或残页，但心魔 +2。'
            : '换取残页、矿石或贡献，名声略涨。',
          data: enemy.trait === 'demon' || enemy.trait === 'rot' || enemy.trait === 'break'
            ? { jade: 1, pages: 1, demon: 2 }
            : { pages: enemy.pages ? 1 : 0, ore: enemy.ore ? 1 : 0, contribution: enemy.contribution ? 2 : 0, reputation: 2 }
        }
      ];
      return choices;
    }

    function strengthenBuild(id) {
      const targets = { sword: 'sword', qingmu: 'qingmu', stone: 'stone', jade: 'jade' };
      const skillId = targets[id] || 'qingmu';
      state.cult += 8 + skill(skillId) * 2;
      if (skillId === 'jade') state.demon += 1;
    }

    function applyRewardChoice(id) {
      const pending = state.pendingReward;
      if (!pending) return;
      const choice = pending.choices.find((item) => item.id === id);
      if (!choice) return;
      const base = pending.base;
      state.cult += base.cult;
      state.silver += base.silver;
      state.herbs += base.herbs;
      state.pages += base.pages;
      state.jade += base.jade;
      state.ore += base.ore;
      state.spirit += base.spirit;
      state.contribution += base.contribution;
      state.reputation += base.reputation;
      state.demon += base.demon;
      applyRewardEffect(choice.data || {});
      state.pendingReward = null;
      log(`你选择${choice.name}，将${pending.enemy}一战所得纳入道途。`, choice.type);
      checkDemonSurge('战利邪气');
      render();
    }

    function applyRewardEffect(data) {
      state.cult += data.cult || 0;
      state.silver += data.silver || 0;
      state.herbs += data.herbs || 0;
      state.pages += data.pages || 0;
      state.jade += data.jade || 0;
      state.ore += data.ore || 0;
      state.spirit += data.spirit || 0;
      state.contribution += data.contribution || 0;
      state.reputation += data.reputation || 0;
      state.demon += data.demon || 0;
      state.hp += data.hp || 0;
      state.qi += data.qi || 0;
      state.demon = Math.max(0, state.demon);
      if (data.build) strengthenBuild(data.build);
    }

    function loseCombat() {
      const e = enemies[state.combat.enemyKey];
      state.hp = Math.ceil(maxHp() * .35);
      state.qi = Math.ceil(maxQi() * .25);
      state.cult = Math.max(0, state.cult - 18);
      state.demon += 4;
      state.combat = null;
      log(`你败给${e.name}，拖着伤体逃回山脚。修为受损，心魔 +4。`, 'bad');
      render();
    }

    function cultivate() {
      if (hasPendingDecision()) return log('先处理当前抉择，再静修吐纳。', 'bad');
      if (state.combat) return log('战斗未结束，无法静修。', 'bad');
      const gain = 12 + skill('qingmu') * 5 + state.realm * 10 + (hasInsight('leafVein') ? 18 : 0);
      state.cult += gain;
      state.qi = clamp(state.qi + 9 + skill('qingmu'), 0, maxQi());
      state.hp = clamp(state.hp + 8 + skill('qingmu') * 2 + (hasInsight('leafVein') ? 8 : 0), 0, maxHp());
      if (state.demon > 0 && Math.random() < .35) { state.demon -= 1; log('你以青木吐纳压下一缕杂念，心魔 -1。', 'good'); }
      log(`你静修吐纳，修为 +${gain}。`, 'good');
    }

    function heal() {
      if (hasPendingDecision()) return log('先处理当前抉择，再服药疗伤。', 'bad');
      if (state.combat) return log('战斗中不能安心服药。', 'bad');
      if (state.herbs < 1) return log('药材不足，无法疗伤。', 'bad');
      if (state.hp >= maxHp() && state.demon <= 0) return log('气血充盈，心神也尚算清明。', 'bad');
      state.herbs -= 1;
      const healHp = 32 + skill('qingmu') * 4 + state.realm * 8;
      state.hp = clamp(state.hp + healHp, 0, maxHp());
      if (state.demon > 0) state.demon = Math.max(0, state.demon - 1);
      log(`你煎药调息，气血恢复 ${healHp}，心魔略定。`, 'good');
    }

    function calmDemon() {
      if (hasPendingDecision()) return log('先处理当前抉择，再镇心调息。', 'bad');
      if (state.combat) return log('战斗中无法镇心调息。', 'bad');
      if (state.demon <= 0) return log('心神清明，暂时不必镇压心魔。', 'bad');
      const cost = { herbs: 1, silver: 12 };
      if (!canPay(cost)) return log(`镇心调息需要${costText(cost)}。`, 'bad');
      payCost(cost);
      const reduce = 12 + skill('qingmu') * 2 + (hasInsight('leafVein') ? 6 : 0);
      state.demon = Math.max(0, state.demon - reduce);
      state.qi = clamp(state.qi + 6 + skill('qingmu'), 0, maxQi());
      log(`你焚香镇心，心魔 -${reduce}。`, 'good');
    }

    function forge() {
      if (hasPendingDecision()) return log('先处理当前抉择，再锻造装备。', 'bad');
      if (state.combat) return log('战斗中不能锻造装备。', 'bad');
      const gear = equipment();
      const target = gear.weapon <= gear.armor ? 'weapon' : 'armor';
      if (gear[target] >= equipmentNames[target].length - 1) return log(`${target === 'weapon' ? '武器' : '护具'}已经锻到当前极限。`, 'bad');
      const nextLevel = gear[target] + 1;
      const oreNeed = nextLevel;
      const silverNeed = 18 + nextLevel * 14;
      if (state.ore < oreNeed || state.silver < silverNeed) return log(`锻造需要矿石 ${oreNeed}、银钱 ${silverNeed}。`, 'bad');
      state.ore -= oreNeed;
      state.silver -= silverNeed;
      gear[target] = nextLevel;
      log(`${target === 'weapon' ? '武器' : '护具'}提升为${equipmentNames[target][nextLevel]}。`, 'good');
    }

    function refineSpirit() {
      if (hasPendingDecision()) return log('先处理当前抉择，再炼化灵石。', 'bad');
      if (state.combat) return log('战斗中不能炼化灵石。', 'bad');
      if (state.spirit < 1) return log('没有可炼化的灵石。', 'bad');
      state.spirit -= 1;
      const gain = 55 + state.realm * 35 + skill('qingmu') * 6;
      state.cult += gain;
      state.qi = maxQi();
      log(`你炼化灵石，真气充盈，修为 +${gain}。`, 'rare');
    }

    function trainSkill(id) {
      if (hasPendingDecision()) return log('先处理当前抉择，再修炼功法。', 'bad');
      if (state.combat) return log('战斗中不能修炼功法。', 'bad');
      const defn = skillDefs[id];
      const lvl = skill(id);
      if (lvl >= defn.max) return log(`${defn.name}已经修到当前极限。`, 'bad');
      const costCult = defn.cost + lvl * 18;
      const costSilver = 4 + lvl * 3;
      const pageNeed = id === 'jade' ? 1 + lvl : lvl >= 4 ? 1 : 0;
      if (state.cult < costCult || state.silver < costSilver || state.pages < pageNeed) return log(`修炼${defn.name}需要修为 ${costCult}、银钱 ${costSilver}${pageNeed ? `、残页 ${pageNeed}` : ''}。`, 'bad');
      state.cult -= costCult;
      state.silver -= costSilver;
      state.pages -= pageNeed;
      state.skills[id] = lvl + 1;
      state.hp = clamp(state.hp + 8, 1, maxHp());
      state.qi = clamp(state.qi + 4, 0, maxQi());
      log(`${defn.name}提升到 ${lvl + 1} 级。`, 'good');
    }

    function breakthrough() {
      if (hasPendingDecision()) return log('先处理当前抉择，再尝试突破。', 'bad');
      if (state.combat) return log('战斗未结束，不能突破。', 'bad');
      if (state.realm >= realms.length - 1) return log('当前原型的境界上限是练气。', 'bad');
      const next = realms[state.realm + 1];
      const herbNeed = state.realm === 0 ? 2 : 5;
      const spiritNeed = state.realm === 0 ? 0 : 2;
      if (state.cult < realm().need || state.herbs < herbNeed || state.spirit < spiritNeed) return log(`突破到${next.name}需要修为 ${realm().need}、药材 ${herbNeed}${spiritNeed ? `、灵石 ${spiritNeed}` : ''}。`, 'bad');
      state.herbs -= herbNeed;
      state.spirit -= spiritNeed;
      const key = state.realm === 0 ? 'rogueMonk' : 'bloodShade';
      startCombat(key, 'break');
      log(`瓶颈化作心障，唯有战胜它才能踏入${next.name}。`, 'rare');
    }

    function breakthroughSuccess() {
      state.realm += 1;
      state.cult = Math.max(0, state.cult - realms[state.realm - 1].need);
      state.hp = maxHp();
      state.qi = maxQi();
      state.demon = Math.max(0, state.demon - 3);
      log(`你冲破瓶颈，踏入${realm().name}。`, 'rare');
    }

    function startTrial() {
      if (hasPendingDecision()) return log('先处理当前抉择，再参加试炼。', 'bad');
      if (state.combat) return log('战斗未结束，不能参加试炼。', 'bad');
      if (state.realm < 2) return log('外门试炼至少需要练气境。', 'bad');
      if ((state.trialStage || 0) < trialStageDefs.length) return log('需要先完成外山四阶试炼。', 'bad');
      if (state.contribution < 18) return log('外门试炼需要门派贡献 18。', 'bad');
      state.contribution -= 18;
      startCombat('trialBeast', 'trial');
      state.combat.enemyHp += 70;
      state.combat.enemyMaxHp += 70;
      log('青云观外门试炼开启，试炼灵兽被阵法放出。', 'rare');
    }

    function trialSuccess() {
      state.sect = '青云外门';
      state.reputation += 35;
      state.spirit += 3;
      log('你通过青云观外门试炼，正式列名外门。当前原型主目标完成。', 'rare');
    }

    function routePhase() {
      if (state.sect === '青云外门') return '外门已入';
      if (state.realm < 1) return '凡人起步';
      if (state.sect === '散修') return '寻入山门';
      if (state.realm < 2) return '外山打底';
      if ((state.trialStage || 0) < trialStageDefs.length) return '四阶试炼';
      return '外门临门';
    }

    function routeAdvice() {
      const items = [];
      const push = (title, body, type = '') => items.push({ title, body, type });
      if (state.combat) push('当前战斗', '先解决眼前敌人，战斗结算后再分配资源。', 'danger');
      if (hasPendingReward()) push('分配战利', '先做战后抉择，让资源进入养成循环。', 'primary');
      if (state.pendingEncounter) push('处理境遇', '先做境遇抉择，把探索事件转成资源或风险。', 'primary');
      if (state.hp < maxHp() * .35) push('疗伤整备', '气血偏低，优先服药或准备回春丹。', 'danger');
      if (state.demon >= 60) push('镇压心魔', '心魔已入高位，镇心调息或准备迎战心魔劫。', 'danger');
      if (supplyCount() < 2 && state.realm >= 1) push('备足丹符', '用药材、灵石和残页换战斗容错，再挑战强敌。');
      if (state.realm === 0 && state.cult < realm().need) push('积累修为', '荒林和破庙适合攒修为、药材和残页。', 'primary');
      if (state.realm === 0 && state.cult >= realm().need && state.herbs >= 2) push('尝试突破', '材料已接近炼体门槛，可以准备突破心障。', 'primary');
      if (state.realm >= 1 && state.sect === '散修') push('入青云外山', '前往青云山道，先拿到门派身份。', 'primary');
      if (state.sect !== '散修' && state.commissionsDone < 3) push('做外山勤务', '门派委托能稳定提供贡献和阶段身份。', 'primary');
      if (state.realm < 2 && state.cult >= realm().need && state.herbs >= 5 && state.spirit >= 2) push('冲击练气', '修为和材料已够，突破后会打开高阶地图和试炼。', 'primary');
      if (state.realm < 2 && state.sect !== '散修') push('准备练气', '继续探索黑风岭、乱葬岗和青云山道，补灵石与修为。');
      const readyInsight = insightDefs.find((item) => canLearnInsight(item));
      if (readyInsight) push('领悟神通', `${readyInsight.name}已经可领悟，可把功法等级转成实战能力。`, 'primary');
      if (state.jade > 0 && skill('jade') <= 0) push('修血玉残法', '血玉已入手，邪法能打开爆发路线，但要控制心魔。');
      if (state.realm >= 2 && (state.trialStage || 0) < trialStageDefs.length) {
        const stage = trialStageDefs[state.trialStage || 0];
        push('推进四阶试炼', `${stage.name}：${trialStageNeedText(state.trialStage || 0)}。`, 'primary');
      }
      if ((state.trialStage || 0) >= trialStageDefs.length && state.contribution < 18) push('补足贡献', '四阶试炼已通，继续做委托补外门试炼贡献。');
      if ((state.trialStage || 0) >= trialStageDefs.length && state.contribution >= 18 && state.realm >= 2) push('外门试炼', '终点条件已近，挑战成功即可列名外门。', 'primary');
      if (state.sect === '青云外门') push('原型主目标完成', '后续应验证内门、秘境和更高境界的正式项目路线。', 'primary');
      return items.slice(0, 3);
    }

    function statusBadges(status, side) {
      const labels = {
        bleed: ['流血', 'bad'],
        poison: ['中毒', 'bad'],
        stun: ['眩晕', 'bad'],
        sealed: ['封气', 'bad'],
        break: ['破绽', side === 'enemy' ? 'good' : 'bad'],
        shield: ['护体', side === 'player' ? 'good' : 'bad'],
        focus: ['蓄势', 'good'],
        rage: ['狂暴', 'bad']
      };
      const html = Object.entries(status || {})
        .filter(([, value]) => value > 0)
        .map(([key, value]) => {
          const [name, type] = labels[key] || [key, ''];
          return `<span class="status ${type}">${name} ${value}</span>`;
      }).join('');
      return html || '<span class="status">无状态</span>';
    }

    function buildRankName(level) {
      return ['未成型', '初成', '小成', '大成'][level] || '未成型';
    }

    function buildEffectText(id, level) {
      if (!level) return '投入对应功法或装备后，会在战斗中形成稳定收益。';
      const effects = {
        sword: `破绽伤害 +${level * 3}，破绽/流血概率提升。`,
        qingmu: `护体、回血和回气提升，持续战更稳。`,
        stone: `守势减伤更强，防守时可反震敌人。`,
        jade: `血玉伤害提升，破绽与流血更重，但心魔压力更高。`
      };
      return effects[id] || '';
    }

    function render() {
      normalizeLog();
      const mh = maxHp();
      const mq = maxQi();
      state.commissionsDone = state.commissionsDone || 0;
      state.trialStage = state.trialStage || 0;
      state.demonTrials = state.demonTrials || 0;
      state.insights = state.insights || {};
      state.supplies = { hpPill: 0, qiPill: 0, ward: 0, ...(state.supplies || {}) };
      state.hp = clamp(state.hp, 0, mh);
      state.qi = clamp(state.qi, 0, mq);
      $('sectPill').textContent = state.sect;
      $('hpText').textContent = `${state.hp}/${mh}`;
      $('qiText').textContent = `${state.qi}/${mq}`;
      $('cultText').textContent = `${state.cult}/${realm().need}`;
      $('demonText').textContent = `${state.demon}/100`;
      $('demonHint').textContent = `心魔：${demonBand()}`;
      $('hpBar').style.width = pct(state.hp, mh);
      $('qiBar').style.width = pct(state.qi, mq);
      $('cultBar').style.width = pct(state.cult, realm().need);
      $('demonBar').style.width = pct(state.demon, 100);
      $('realmText').textContent = realm().name;
      $('powerText').textContent = power();
      $('atkText').textContent = atk();
      $('defText').textContent = def();
      $('agiText').textContent = agi();
      $('repText').textContent = state.reputation;
      $('weaponText').textContent = equipmentNames.weapon[equipment().weapon];
      $('armorText').textContent = equipmentNames.armor[equipment().armor];
      $('mainTitle').textContent = state.sect === '青云外门' ? '外门已入，道途初开' : `${realm().name}境界，${maps.find(m => m.id === state.selectedMap).name}`;
      $('mainDesc').textContent = state.sect === '青云外门' ? '你已经完成当前原型主目标。真正的修仙养成从外门开始，后续应扩展内门、秘境和更高境界。' : maps.find(m => m.id === state.selectedMap).desc;
      $('mapHint').textContent = `当前：${maps.find(m => m.id === state.selectedMap).reward}`;

      const doneCount = objectives.filter((item) => item.check()).length;
      $('goalHint').textContent = `${doneCount}/${objectives.length}`;
      $('objectives').innerHTML = objectives.map((item) => {
        const done = item.check();
        return `<div class="objective ${done ? 'done' : ''}"><strong>${done ? '已成：' : '待成：'}${item.name}</strong><span>${done ? '这一步已经纳入你的道途。' : item.hint}</span></div>`;
      }).join('');

      const advice = routeAdvice();
      $('adviceHint').textContent = routePhase();
      $('adviceList').innerHTML = advice.map((item, index) => `<div class="advice-card ${item.type || ''}">
        <strong>${index + 1}. ${item.title}</strong>
        <span>${item.body}</span>
      </div>`).join('');

      $('inventory').innerHTML = [
        ['银钱', state.silver], ['药材', state.herbs], ['残页', state.pages], ['血玉', state.jade], ['矿石', state.ore], ['灵石', state.spirit], ['回春丹', supplies().hpPill], ['回气丹', supplies().qiPill], ['护身符', supplies().ward], ['贡献', state.contribution], ['委托', state.commissionsDone], ['试炼', `${state.trialStage}/${trialStageDefs.length}`], ['心魔劫', state.demonTrials]
      ].map(([name, val]) => `<div class="tile"><b>${name}</b><span>${val}</span></div>`).join('');

      $('zones').innerHTML = maps.map((m) => {
        const locked = !canEnter(m);
        return `<button class="zone ${state.selectedMap === m.id ? 'active' : ''} ${locked ? 'locked' : ''}" data-map="${m.id}" ${locked ? 'disabled' : ''}>
          <strong>${m.name}</strong><span>${m.desc}</span><em>${locked ? `需要${realms[m.needRealm].name}` : m.reward}</em>
        </button>`;
      }).join('');
      document.querySelectorAll('[data-map]').forEach((btn) => btn.addEventListener('click', () => selectMap(btn.dataset.map)));

      $('commissionHint').textContent = state.sect === '散修' ? '入外山后开启' : `${state.commissionsDone} 次完成`;
      $('commissions').innerHTML = commissionDefs.map((item) => {
        const locked = !canStartCommission(item);
        const lockText = state.sect === '散修' ? '尚未入山' : state.realm < item.needRealm ? item.need : item.cost && !canStartCommission(item) ? item.need : item.reward;
        return `<button class="commission ${locked ? 'locked' : ''}" data-commission="${item.id}" ${locked ? 'disabled' : ''}>
          <strong>${item.name}</strong>
          <span>${item.desc}</span>
          <em>${locked ? `需要：${lockText}` : item.reward}</em>
        </button>`;
      }).join('');
      document.querySelectorAll('[data-commission]').forEach((btn) => btn.addEventListener('click', () => startCommission(btn.dataset.commission)));

      $('trialHint').textContent = state.sect === '散修' ? '入外山后开启' : `${state.trialStage}/${trialStageDefs.length}`;
      $('trialStages').innerHTML = trialStageDefs.map((item, index) => {
        const cleared = state.trialStage > index;
        const ready = canStartTrialStage(index);
        return `<button class="trial-stage ${cleared ? 'cleared' : ready ? '' : 'locked'}" data-trial-stage="${index}" ${cleared || !ready ? 'disabled' : ''}>
          <strong>${item.name}</strong>
          <span>${item.desc}</span>
          <em>${cleared ? '已通过' : ready ? item.reward : `需要：${trialStageNeedText(index)}`}</em>
        </button>`;
      }).join('');
      document.querySelectorAll('[data-trial-stage]').forEach((btn) => btn.addEventListener('click', () => startTrialStage(Number(btn.dataset.trialStage))));

      $('skills').innerHTML = Object.entries(skillDefs).map(([id, defn]) => {
        const lvl = skill(id);
        const locked = id === 'jade' && state.jade <= 0 && lvl <= 0;
        return `<button class="skill-btn" data-skill="${id}" ${locked ? 'disabled' : ''}>
          <strong><span>${defn.name}</span><span>${lvl}/${defn.max}</span></strong>
          <p>${defn.type}。${locked ? '需要先获得血玉。' : defn.desc}</p>
        </button>`;
      }).join('');
      document.querySelectorAll('[data-skill]').forEach((btn) => btn.addEventListener('click', () => trainSkill(btn.dataset.skill)));

      const scores = buildScores();
      const activeBuild = dominantBuild();
      $('buildHint').textContent = buildDefs.find((item) => item.id === activeBuild)?.name || '';
      $('builds').innerHTML = buildDefs.map((item) => {
        const level = buildLevel(item.id);
        return `<div class="build-card ${item.id === activeBuild ? 'active' : ''}">
          <strong><span>${item.name}</span><span>${buildRankName(level)} ${scores[item.id]}</span></strong>
          <span>${item.desc}</span>
          <span>${buildEffectText(item.id, level)}</span>
        </div>`;
      }).join('');

      $('insightHint').textContent = `${insightCount()}/${insightDefs.length}`;
      $('insights').innerHTML = insightDefs.map((item) => {
        const learned = hasInsight(item.id);
        const ready = canLearnInsight(item);
        return `<button class="insight-card ${learned ? 'learned' : ready ? '' : 'locked'}" data-insight="${item.id}" ${learned || !ready ? 'disabled' : ''}>
          <strong><span>${item.name}</span><span>${learned ? '已领悟' : ready ? '可领悟' : '未满足'}</span></strong>
          <span>${item.desc}</span>
          <span>${learned ? '这门神通已纳入你的道途。' : `条件：${insightNeedText(item)}`}</span>
        </button>`;
      }).join('');
      document.querySelectorAll('[data-insight]').forEach((btn) => btn.addEventListener('click', () => learnInsight(btn.dataset.insight)));

      $('log').innerHTML = state.log.map((entry) => `<div class="log-line ${entry.type || ''}">${entry.text}</div>`).join('');
      const inCombat = !!state.combat;
      $('combatBox').hidden = !inCombat;
      $('combatActions').hidden = !inCombat;
      const supplyLabels = { hpPill: '回春丹', qiPill: '回气丹', ward: '护身符' };
      Object.entries(supplyLabels).forEach(([key, name]) => {
        const btn = document.querySelector(`[data-action="${key}"]`);
        if (btn) btn.textContent = `${name} ${supplies()[key] || 0}`;
      });
      const pending = state.pendingReward;
      $('rewardPanel').hidden = !pending;
      if (pending) {
        $('rewardHint').textContent = pending.enemy;
        $('rewardChoices').innerHTML = pending.choices.map((choice) => `<button class="reward-choice ${choice.type || ''}" data-reward="${choice.id}">
          <strong>${choice.name}</strong>
          <span>${choice.desc}</span>
        </button>`).join('');
        document.querySelectorAll('[data-reward]').forEach((btn) => btn.addEventListener('click', () => applyRewardChoice(btn.dataset.reward)));
      } else {
        $('rewardHint').textContent = '';
        $('rewardChoices').innerHTML = '';
      }
      const encounter = state.pendingEncounter;
      $('encounterPanel').hidden = !encounter;
      if (encounter) {
        $('encounterHint').textContent = encounter.title;
        $('encounterChoices').innerHTML = encounter.choices.map((choice) => `<button class="reward-choice ${choice.type || ''}" data-encounter="${choice.id}">
          <strong>${choice.name}</strong>
          <span>${choice.desc}${choice.cost ? ` 需要：${costText(choice.cost)}` : ''}</span>
        </button>`).join('');
        document.querySelectorAll('[data-encounter]').forEach((btn) => btn.addEventListener('click', () => applyEncounterChoice(btn.dataset.encounter)));
      } else {
        $('encounterHint').textContent = '';
        $('encounterChoices').innerHTML = '';
      }
      if (inCombat) {
        const c = state.combat;
        const e = enemies[c.enemyKey];
        $('battlePlayerHp').textContent = `${state.hp}/${mh}`;
        $('battlePlayerHpBar').style.width = pct(state.hp, mh);
        $('playerStatuses').innerHTML = statusBadges(c.playerStatus, 'player');
        $('enemyName').textContent = e.name;
        $('enemyHp').textContent = `${Math.max(0, c.enemyHp)}/${c.enemyMaxHp}`;
        $('enemyHpBar').style.width = pct(Math.max(0, c.enemyHp), c.enemyMaxHp);
        $('enemyStatuses').innerHTML = statusBadges(c.enemyStatus, 'enemy');
      }
    }

    function save() {
      state = migrateState(state);
      localStorage.setItem('fan-gu-wen-dao-save', JSON.stringify(state));
      log('进度已保存到本地。', 'good');
    }

    function load() {
      const raw = localStorage.getItem('fan-gu-wen-dao-save');
      if (!raw) return log('没有找到本地存档。', 'bad');
      try { state = migrateState(JSON.parse(raw)); log('已读取本地存档。', 'good'); }
      catch { log('存档损坏，读取失败。', 'bad'); }
      render();
    }

    function reset() {
      if (!confirm('确定重开？本地当前进度会被清空。')) return;
      localStorage.removeItem('fan-gu-wen-dao-save');
      state = initialState();
      render();
    }

    $('exploreBtn').addEventListener('click', explore);
    $('cultivateBtn').addEventListener('click', cultivate);
    $('healBtn').addEventListener('click', heal);
    $('forgeBtn').addEventListener('click', forge);
    $('refineBtn').addEventListener('click', refineSpirit);
    $('calmBtn').addEventListener('click', calmDemon);
    $('prepHpBtn').addEventListener('click', () => prepareSupply('hpPill'));
    $('prepQiBtn').addEventListener('click', () => prepareSupply('qiPill'));
    $('prepWardBtn').addEventListener('click', () => prepareSupply('ward'));
    $('breakBtn').addEventListener('click', breakthrough);
    $('trialBtn').addEventListener('click', startTrial);
    $('saveBtn').addEventListener('click', save);
    $('loadBtn').addEventListener('click', load);
    $('resetBtn').addEventListener('click', reset);
    document.querySelectorAll('[data-action]').forEach((btn) => btn.addEventListener('click', () => playerAction(btn.dataset.action)));

    render();
  </script>
</body>
</html>
